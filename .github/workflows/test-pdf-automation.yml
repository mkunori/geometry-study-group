name: Test PDF Automation

on:
  pull_request:
    paths:
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/test-pdf-automation.yml'

permissions:
  contents: read

concurrency:
  group: pdf-tests-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  test:
    name: PDF automation (Ubuntu 24.04)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out PR revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.21.0'
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Test PDF automation
        run: npm run test:pdf
