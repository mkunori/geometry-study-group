<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600" role="img" aria-labelledby="title desc">
<title id="title">2平面の交わり：点ではなく1本の直線</title><desc id="desc">固定例E。z=2とx=1の交線は(1,t,2)。n1=(0,0,1)、n2=(1,0,0)、n1×n2=(0,1,0)。右手系の斜投影。</desc><defs>
<marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#1565c0" /></marker>
<marker id="orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#ba4b00" /></marker>
<marker id="purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#7b3294" /></marker>
<marker id="gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#58677c" /></marker>
</defs><rect width="1000" height="600" fill="white" /><g font-family="Yu Gothic, Meiryo, Noto Sans CJK JP, sans-serif" fill="#172b4d">
<text x="30" y="42" fill="#172b4d" font-size="28" text-anchor="start" font-weight="700">2平面の交わり：点ではなく1本の直線</text>
<line x1="300" y1="480" x2="540" y2="400" stroke="#58677c" stroke-width="2" marker-end="url(#gray)" />
<text x="550" y="392" fill="#172b4d" font-size="22" text-anchor="start">X</text>
<line x1="300" y1="480" x2="160" y2="392" stroke="#58677c" stroke-width="2" marker-end="url(#gray)" />
<text x="135" y="416" fill="#172b4d" font-size="22" text-anchor="start">Y</text>
<line x1="300" y1="480" x2="300" y2="156" stroke="#58677c" stroke-width="2" marker-end="url(#gray)" />
<text x="310" y="148" fill="#172b4d" font-size="22" text-anchor="start">Z</text>
<polygon points="275,450 515,370 375,282 135,362" fill="#dce9f8" stroke="#1565c0" stroke-width="2" fill-opacity=".8" />
<polygon points="395,482 255,394 255,250 395,338" fill="#fbe5d7" stroke="#ba4b00" stroke-width="2" fill-opacity=".7" />
<line x1="402" y1="414.4" x2="244.5" y2="315.4" stroke="#7b3294" stroke-width="5" marker-end="url(#purple)" marker-start="url(#purple)" />
<circle cx="360" cy="388" r="5" fill="#7b3294" data-coordinate="1,0,2" />
<line x1="360" y1="388" x2="345" y2="495" stroke="#58677c" stroke-width="1" stroke-dasharray="4 4" />
<text x="315" y="525" fill="#7b3294" font-size="22" text-anchor="start">X₀=(1,0,2)</text>
<line x1="205" y1="406" x2="205" y2="370" stroke="#1565c0" stroke-width="3" marker-end="url(#blue)" />
<text x="82" y="355" fill="#1565c0" font-size="23" text-anchor="start">n₁：+Z</text>
<line x1="381" y1="437.2" x2="441" y2="417.2" stroke="#ba4b00" stroke-width="3" marker-end="url(#orange)" />
<text x="455" y="435" fill="#ba4b00" font-size="23" text-anchor="start">n₂：+X</text>
<text x="145" y="260" fill="#1565c0" font-size="24" text-anchor="start">z=2</text>
<text x="390" y="250" fill="#ba4b00" font-size="24" text-anchor="start">x=1</text>
<text x="600" y="145" fill="#172b4d" font-size="27" text-anchor="start" font-weight="700">方向 v=n₁×n₂</text>
<text x="600" y="210" fill="#7b3294" font-size="27" text-anchor="start">v=(0,1,0)：+Y</text>
<text x="600" y="285" fill="#172b4d" font-size="24" text-anchor="start">連立条件：z=2、x=1</text>
<text x="600" y="355" fill="#172b4d" font-size="23" text-anchor="start">yを0にしてX₀=(1,0,2)</text>
<text x="600" y="425" fill="#7b3294" font-size="27" text-anchor="start">交線 X(t)=(1,t,2)</text>
<text x="600" y="490" fill="#172b4d" font-size="24" text-anchor="start">tはすべての実数</text>
<text x="30" y="565" fill="#172b4d" font-size="22" text-anchor="start">交線の方向と、交線上の1点を別に求める。四角形の輪郭は境界ではない。</text>
</g></svg>
