<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="590" viewBox="0 0 1000 590" role="img" aria-labelledby="title desc">
<title id="title">閉線分：範囲外・端点・重複区間を区別する</title><desc id="desc">固定例C。左はP=(0,0)、r=(2,0)、Q=(3,-1)、s=(0,2)でt=3/2。中央はQ=(2,-1)でt=1。右はP=(0,0)、r=(4,0)、Q=(2,0)、s=(4,0)で区間(2,0)から(4,0)が共通。</desc><defs>
<marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#1565c0" /></marker>
<marker id="orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#ba4b00" /></marker>
<marker id="purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#7b3294" /></marker>
<marker id="gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#58677c" /></marker>
</defs><rect width="1000" height="590" fill="white" /><g font-family="Yu Gothic, Meiryo, Noto Sans CJK JP, sans-serif" fill="#172b4d">
<text x="30" y="42" fill="#172b4d" font-size="28" text-anchor="start" font-weight="700">閉線分：範囲外・端点・重複区間を区別する</text>
<text x="25" y="110" fill="#172b4d" font-size="26" text-anchor="start" font-weight="700">延長線だけ</text>
<line x1="40" y1="325" x2="280" y2="325" stroke="#58677c" stroke-width="2" stroke-dasharray="7 6" />
<line x1="40" y1="325" x2="160" y2="325" stroke="#1565c0" stroke-width="5" />
<line x1="220" y1="385" x2="220" y2="265" stroke="#ba4b00" stroke-width="4" marker-end="url(#orange)" />
<circle cx="40" cy="325" r="5" fill="#1565c0" data-coordinate="0,0" data-origin="40,325" data-scale="60" />
<text x="40" y="360" fill="#1565c0" font-size="24" text-anchor="start">P</text>
<circle cx="160" cy="325" r="5" fill="#1565c0" data-coordinate="2,0" data-origin="40,325" data-scale="60" />
<text x="125" y="390" fill="#1565c0" font-size="24" text-anchor="start">(2,0)</text>
<circle cx="220" cy="385" r="5" fill="#ba4b00" data-coordinate="3,-1" data-origin="40,325" data-scale="60" />
<text x="160" y="427" fill="#ba4b00" font-size="24" text-anchor="start">Q=(3,−1)</text>
<circle cx="220" cy="325" r="5" fill="#7b3294" data-coordinate="3,0" data-origin="40,325" data-scale="60" />
<text x="232" y="305" fill="#7b3294" font-size="24" text-anchor="start">(3,0)</text>
<text x="25" y="185" fill="#7b3294" font-size="23" text-anchor="start">t=3/2、u=1/2</text>
<text x="25" y="500" fill="#7b3294" font-size="24" text-anchor="start">線分の共有点なし</text>
<line x1="326" y1="85" x2="326" y2="535" stroke="#58677c" stroke-width="1" />
<text x="358" y="110" fill="#172b4d" font-size="26" text-anchor="start" font-weight="700">端点で接触</text>
<line x1="373" y1="325" x2="613" y2="325" stroke="#58677c" stroke-width="2" stroke-dasharray="7 6" />
<line x1="373" y1="325" x2="493" y2="325" stroke="#1565c0" stroke-width="5" />
<line x1="493" y1="385" x2="493" y2="265" stroke="#ba4b00" stroke-width="4" marker-end="url(#orange)" />
<circle cx="373" cy="325" r="5" fill="#1565c0" data-coordinate="0,0" data-origin="373,325" data-scale="60" />
<text x="373" y="360" fill="#1565c0" font-size="24" text-anchor="start">P</text>
<circle cx="493" cy="325" r="5" fill="#1565c0" data-coordinate="2,0" data-origin="373,325" data-scale="60" />
<text x="458" y="390" fill="#1565c0" font-size="24" text-anchor="start">(2,0)</text>
<circle cx="493" cy="385" r="5" fill="#ba4b00" data-coordinate="2,-1" data-origin="373,325" data-scale="60" />
<text x="433" y="427" fill="#ba4b00" font-size="24" text-anchor="start">Q=(2,−1)</text>
<circle cx="493" cy="325" r="5" fill="#7b3294" data-coordinate="2,0" data-origin="373,325" data-scale="60" />
<text x="505" y="305" fill="#7b3294" font-size="24" text-anchor="start">(2,0)</text>
<text x="358" y="185" fill="#7b3294" font-size="23" text-anchor="start">t=1、u=1/2</text>
<text x="358" y="500" fill="#7b3294" font-size="24" text-anchor="start">端点1点が共通</text>
<line x1="659" y1="85" x2="659" y2="535" stroke="#58677c" stroke-width="1" />
<text x="691" y="110" fill="#172b4d" font-size="26" text-anchor="start" font-weight="700">同一直線の重なり</text>
<line x1="706" y1="325" x2="882" y2="325" stroke="#1565c0" stroke-width="7" />
<line x1="794" y1="325" x2="970" y2="325" stroke="#ba4b00" stroke-width="4" />
<line x1="794" y1="325" x2="882" y2="325" stroke="#7b3294" stroke-width="9" />
<circle cx="706" cy="325" r="5" fill="#1565c0" data-coordinate="0,0" data-origin="706,325" data-scale="44" />
<text x="706" y="360" fill="#1565c0" font-size="24" text-anchor="start">P</text>
<circle cx="794" cy="325" r="5" fill="#ba4b00" data-coordinate="2,0" data-origin="706,325" data-scale="44" />
<text x="754" y="300" fill="#ba4b00" font-size="24" text-anchor="start">Q=(2,0)</text>
<circle cx="882" cy="325" r="5" fill="#7b3294" data-coordinate="4,0" data-origin="706,325" data-scale="44" />
<text x="852" y="390" fill="#7b3294" font-size="24" text-anchor="start">(4,0)</text>
<circle cx="970" cy="325" r="5" fill="#ba4b00" data-coordinate="6,0" data-origin="706,325" data-scale="44" />
<text x="970" y="360" fill="#ba4b00" font-size="23" text-anchor="end">(6,0)</text>
<text x="691" y="185" fill="#172b4d" font-size="23" text-anchor="start">r=(4,0)、s=(4,0)</text>
<text x="691" y="450" fill="#7b3294" font-size="25" text-anchor="start">共有区間</text>
<text x="691" y="500" fill="#7b3294" font-size="24" text-anchor="start">(2,0) 〜 (4,0)</text>
<text x="30" y="565" fill="#172b4d" font-size="22" text-anchor="start">破線の延長は線分に含まれない。重複区間を1つの交点に置き換えない。</text>
</g></svg>
