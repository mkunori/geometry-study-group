<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="590" viewBox="0 0 1000 590" role="img" aria-labelledby="title desc">
<title id="title">2Dの交点：両方から同じ点へ着く</title><desc id="desc">固定例A。P=(0,0)、r=(4,4)、Q=(0,4)、s=(4,-4)。交点(2,2)にt=u=1/2で着く。</desc><defs>
<marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#1565c0" /></marker>
<marker id="orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#ba4b00" /></marker>
<marker id="purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#7b3294" /></marker>
<marker id="gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#58677c" /></marker>
</defs><rect width="1000" height="590" fill="white" /><g font-family="Yu Gothic, Meiryo, Noto Sans CJK JP, sans-serif" fill="#172b4d">
<text x="30" y="42" fill="#172b4d" font-size="28" text-anchor="start" font-weight="700">2Dの交点：両方から同じ点へ着く</text>
<line x1="105" y1="455" x2="460" y2="455" stroke="#58677c" stroke-width="2" marker-end="url(#gray)" />
<line x1="105" y1="455" x2="105" y2="110" stroke="#58677c" stroke-width="2" marker-end="url(#gray)" />
<text x="470" y="463" fill="#172b4d" font-size="22" text-anchor="start">X</text>
<text x="85" y="98" fill="#172b4d" font-size="22" text-anchor="start">Y</text>
<line x1="91.4" y1="468.6" x2="411" y2="149" stroke="#58677c" stroke-width="2" stroke-dasharray="7 6" />
<line x1="91.4" y1="169.4" x2="411" y2="489" stroke="#58677c" stroke-width="2" stroke-dasharray="7 6" />
<line x1="105" y1="455" x2="377" y2="183" stroke="#1565c0" stroke-width="4" marker-end="url(#blue)" />
<line x1="105" y1="183" x2="377" y2="455" stroke="#ba4b00" stroke-width="4" marker-end="url(#orange)" />
<circle cx="105" cy="455" r="5" fill="#1565c0" data-coordinate="0,0" data-origin="105,455" data-scale="68" />
<text x="85" y="495" fill="#1565c0" font-size="24" text-anchor="start">P=(0,0)</text>
<circle cx="105" cy="183" r="5" fill="#ba4b00" data-coordinate="0,4" data-origin="105,455" data-scale="68" />
<text x="117" y="163" fill="#ba4b00" font-size="24" text-anchor="start">Q=(0,4)</text>
<circle cx="377" cy="183" r="5" fill="#1565c0" data-coordinate="4,4" data-origin="105,455" data-scale="68" />
<text x="387" y="171" fill="#1565c0" font-size="24" text-anchor="start">P+r=(4,4)</text>
<circle cx="377" cy="455" r="5" fill="#ba4b00" data-coordinate="4,0" data-origin="105,455" data-scale="68" />
<text x="287" y="495" fill="#ba4b00" font-size="24" text-anchor="start">Q+s=(4,0)</text>
<circle cx="241" cy="319" r="5" fill="#7b3294" data-coordinate="2,2" data-origin="105,455" data-scale="68" />
<text x="259" y="324" fill="#7b3294" font-size="24" text-anchor="start">(2,2)</text>
<text x="560" y="145" fill="#172b4d" font-size="28" text-anchor="start" font-weight="700">P+tr = Q+us</text>
<text x="560" y="220" fill="#172b4d" font-size="25" text-anchor="start">r=(4,4)、s=(4,−4)</text>
<text x="560" y="295" fill="#7b3294" font-size="30" text-anchor="start">t=u=1/2</text>
<text x="560" y="365" fill="#172b4d" font-size="24" text-anchor="start">両方の式で(2,2)になる</text>
<text x="560" y="435" fill="#172b4d" font-size="24" text-anchor="start">0&lt;t,u&lt;1：線分の内部</text>
<text x="30" y="555" fill="#172b4d" font-size="23" text-anchor="start">X右・Y上。青と橙の矢印は、それぞれtとuが増える向き。</text>
</g></svg>
