<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600" role="img" aria-labelledby="title desc">
<title id="title">平面は、面上の点Aと非ゼロの法線nで決まる</title><desc id="desc">右手系の斜投影。A=(0,0,2)、B=(2,0,2)、C=(0,3,2)。2辺の外積n=(0,0,6)は+Z。平面式6(z-2)=0からz=2。</desc><defs>
<marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#1565c0" /></marker>
<marker id="orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#ba4b00" /></marker>
<marker id="purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#7b3294" /></marker>
<marker id="gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#58677c" /></marker>
</defs><rect width="1000" height="600" fill="white" /><g font-family="Yu Gothic, Meiryo, Noto Sans CJK JP, sans-serif" fill="#172b4d">
<text x="30" y="42" fill="#172b4d" font-size="28" text-anchor="start" font-weight="700">平面は、面上の点Aと非ゼロの法線nで決まる</text>
<line x1="260" y1="500" x2="500" y2="420" stroke="#58677c" stroke-width="2" marker-end="url(#gray)" />
<text x="510" y="412" fill="#172b4d" font-size="22" text-anchor="start">X</text>
<line x1="260" y1="500" x2="120" y2="412" stroke="#58677c" stroke-width="2" marker-end="url(#gray)" />
<text x="100" y="435" fill="#172b4d" font-size="22" text-anchor="start">Y</text>
<line x1="260" y1="500" x2="260" y2="176" stroke="#58677c" stroke-width="2" marker-end="url(#gray)" />
<text x="270" y="168" fill="#172b4d" font-size="22" text-anchor="start">Z</text>
<polygon points="235,470 535,370 360,260 60,360" fill="#e5eef9" stroke="#58677c" stroke-width="2" fill-opacity=".72" />
<polygon points="260,428 380,388 155,362" fill="#d5e1f3" stroke="#1565c0" stroke-width="2" />
<line x1="260" y1="428" x2="380" y2="388" stroke="#1565c0" stroke-width="4" marker-end="url(#blue)" />
<line x1="260" y1="428" x2="155" y2="362" stroke="#ba4b00" stroke-width="4" marker-end="url(#orange)" />
<line x1="260" y1="428" x2="260" y2="212" stroke="#7b3294" stroke-width="5" marker-end="url(#purple)" />
<circle cx="260" cy="428" r="5" fill="#1565c0" data-coordinate="0,0,2" />
<line x1="260" y1="428" x2="310" y2="505" stroke="#58677c" stroke-width="1" stroke-dasharray="4 4" />
<text x="310" y="530" fill="#1565c0" font-size="24" text-anchor="start">A=(0,0,2)</text>
<circle cx="380" cy="388" r="5" fill="#1565c0" data-coordinate="2,0,2" />
<text x="392" y="375" fill="#1565c0" font-size="24" text-anchor="start">B=(2,0,2)</text>
<circle cx="155" cy="362" r="5" fill="#ba4b00" data-coordinate="0,3,2" />
<text x="35" y="340" fill="#ba4b00" font-size="24" text-anchor="start">C=(0,3,2)</text>
<text x="280" y="235" fill="#7b3294" font-size="24" text-anchor="start">n=(0,0,6)</text>
<text x="70" y="485" fill="#172b4d" font-size="24" text-anchor="start">z=2</text>
<text x="570" y="145" fill="#172b4d" font-size="26" text-anchor="start" font-weight="700">面上の変位はnと垂直</text>
<text x="570" y="215" fill="#172b4d" font-size="28" text-anchor="start">n・(X−A)=0</text>
<text x="570" y="285" fill="#7b3294" font-size="27" text-anchor="start">6(z−2)=0 → z=2</text>
<text x="570" y="365" fill="#172b4d" font-size="24" text-anchor="start">nは単位長でなくてよい</text>
<text x="570" y="435" fill="#172b4d" font-size="23" text-anchor="start">n=0では平面を決められない</text>
<text x="30" y="565" fill="#172b4d" font-size="22" text-anchor="start">四角形は無限平面の一部を描いた模式図。輪郭は境界条件ではない。</text>
</g></svg>
