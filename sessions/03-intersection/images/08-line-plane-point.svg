<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600" role="img" aria-labelledby="title desc">
<title id="title">直線×平面：平面の条件を満たすtを求める</title><desc id="desc">固定例D。平面z=2、法線n=(0,0,6)。P=(1,2,0)、d=(2,0,4)。交点I=(2,2,2)、t=1/2。P+d=(3,2,4)との線分内部でもある。</desc><defs>
<marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#1565c0" /></marker>
<marker id="orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#ba4b00" /></marker>
<marker id="purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#7b3294" /></marker>
<marker id="gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#58677c" /></marker>
</defs><rect width="1000" height="600" fill="white" /><g font-family="Yu Gothic, Meiryo, Noto Sans CJK JP, sans-serif" fill="#172b4d">
<text x="30" y="42" fill="#172b4d" font-size="28" text-anchor="start" font-weight="700">直線×平面：平面の条件を満たすtを求める</text>
<polygon points="225,470 525,370 350,260 50,360" fill="#e5eef9" stroke="#58677c" stroke-width="2" fill-opacity=".72" />
<line x1="222" y1="463.6" x2="378" y2="224.4" stroke="#58677c" stroke-width="2" stroke-dasharray="7 6" />
<line x1="240" y1="436" x2="360" y2="252" stroke="#1565c0" stroke-width="4" marker-end="url(#blue)" />
<circle cx="240" cy="436" r="5" fill="#1565c0" data-coordinate="1,2,0" />
<text x="160" y="478" fill="#1565c0" font-size="24" text-anchor="start">P=(1,2,0)</text>
<circle cx="360" cy="252" r="5" fill="#1565c0" data-coordinate="3,2,4" />
<text x="370" y="232" fill="#1565c0" font-size="24" text-anchor="start">P+d=(3,2,4)</text>
<circle cx="300" cy="344" r="5" fill="#7b3294" data-coordinate="2,2,2" />
<text x="320" y="354" fill="#7b3294" font-size="24" text-anchor="start">I=(2,2,2)</text>
<line x1="226" y1="436" x2="226" y2="364" stroke="#7b3294" stroke-width="3" marker-end="url(#purple)" />
<text x="190" y="400" fill="#7b3294" font-size="24" text-anchor="start">n</text>
<text x="70" y="365" fill="#172b4d" font-size="24" text-anchor="start">平面 z=2</text>
<text x="580" y="140" fill="#172b4d" font-size="28" text-anchor="start" font-weight="700">n・d = 24</text>
<text x="580" y="215" fill="#172b4d" font-size="27" text-anchor="start">n・(A−P) = 12</text>
<text x="580" y="295" fill="#7b3294" font-size="28" text-anchor="start">t = 12/24 = 1/2</text>
<text x="580" y="375" fill="#7b3294" font-size="27" text-anchor="start">P+td = (2,2,2)</text>
<text x="580" y="450" fill="#172b4d" font-size="24" text-anchor="start">0&lt;t&lt;1：線分内部</text>
<text x="30" y="565" fill="#172b4d" font-size="23" text-anchor="start">直線上の点P+tdを、平面式n・(X−A)=0へ代入する。</text>
</g></svg>
