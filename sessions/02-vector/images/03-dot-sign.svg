<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560" role="img" aria-labelledby="title desc">
<title id="title">内積の符号：同じ向きの成分があるか</title><desc id="desc">3つの図でb=(2,0)を固定。a=(1,1)なら鋭角で正、a=(0,1)なら直角で0、a=(-1,1)なら鈍角で負。全ベクトルは非ゼロ。</desc><defs>
<marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#1565c0" /></marker>
<marker id="orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#ba4b00" /></marker>
<marker id="purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#7b3294" /></marker>
<marker id="gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#58677c" /></marker>
</defs><rect width="1000" height="560" fill="white" /><g font-family="Yu Gothic, Meiryo, Noto Sans CJK JP, sans-serif" fill="#172b4d">
<text x="30" y="42" fill="#172b4d" font-size="28" text-anchor="start" font-weight="700">内積の符号：同じ向きの成分があるか</text>
<text x="35" y="115" fill="#172b4d" font-size="26" text-anchor="start" font-weight="700">鋭角：45°</text>
<line x1="25" y1="335" x2="303" y2="335" stroke="#58677c" stroke-width="2" />
<line x1="135" y1="335" x2="135" y2="200" stroke="#58677c" stroke-width="2" />
<line x1="135" y1="335" x2="285" y2="335" stroke="#ba4b00" stroke-width="4" marker-end="url(#orange)" />
<line x1="135" y1="335" x2="225" y2="245" stroke="#1565c0" stroke-width="4" marker-end="url(#blue)" />
<circle cx="225" cy="245" r="5" fill="#1565c0" />
<text x="217" y="227" fill="#1565c0" font-size="24" text-anchor="start">a</text>
<text x="235" y="370" fill="#ba4b00" font-size="24" text-anchor="start">b</text>
<text x="90" y="370" fill="#172b4d" font-size="22" text-anchor="start">O</text>
<path d="M177 335 A42 42 0 0 0 164.698 305.302" fill="none" stroke="#58677c" stroke-width="2" />
<text x="25" y="435" fill="#7b3294" font-size="26" text-anchor="start">正：a・b = 2</text>
<text x="25" y="482" fill="#172b4d" font-size="23" text-anchor="start">a=(1,1)</text>
<line x1="328" y1="90" x2="328" y2="500" stroke="#58677c" stroke-width="1" />
<text x="368" y="115" fill="#172b4d" font-size="26" text-anchor="start" font-weight="700">直角：90°</text>
<line x1="358" y1="335" x2="636" y2="335" stroke="#58677c" stroke-width="2" />
<line x1="468" y1="335" x2="468" y2="200" stroke="#58677c" stroke-width="2" />
<line x1="468" y1="335" x2="618" y2="335" stroke="#ba4b00" stroke-width="4" marker-end="url(#orange)" />
<line x1="468" y1="335" x2="468" y2="245" stroke="#1565c0" stroke-width="4" marker-end="url(#blue)" />
<circle cx="468" cy="245" r="5" fill="#1565c0" />
<text x="460" y="227" fill="#1565c0" font-size="24" text-anchor="start">a</text>
<text x="568" y="370" fill="#ba4b00" font-size="24" text-anchor="start">b</text>
<text x="423" y="370" fill="#172b4d" font-size="22" text-anchor="start">O</text>
<path d="M510 335 A42 42 0 0 0 468 293" fill="none" stroke="#58677c" stroke-width="2" />
<text x="358" y="435" fill="#7b3294" font-size="26" text-anchor="start">0：a・b = 0</text>
<text x="358" y="482" fill="#172b4d" font-size="23" text-anchor="start">a=(0,1)</text>
<line x1="661" y1="90" x2="661" y2="500" stroke="#58677c" stroke-width="1" />
<text x="701" y="115" fill="#172b4d" font-size="26" text-anchor="start" font-weight="700">鈍角：135°</text>
<line x1="691" y1="335" x2="969" y2="335" stroke="#58677c" stroke-width="2" />
<line x1="801" y1="335" x2="801" y2="200" stroke="#58677c" stroke-width="2" />
<line x1="801" y1="335" x2="951" y2="335" stroke="#ba4b00" stroke-width="4" marker-end="url(#orange)" />
<line x1="801" y1="335" x2="711" y2="245" stroke="#1565c0" stroke-width="4" marker-end="url(#blue)" />
<circle cx="711" cy="245" r="5" fill="#1565c0" />
<text x="703" y="227" fill="#1565c0" font-size="24" text-anchor="start">a</text>
<text x="901" y="370" fill="#ba4b00" font-size="24" text-anchor="start">b</text>
<text x="756" y="370" fill="#172b4d" font-size="22" text-anchor="start">O</text>
<path d="M843 335 A42 42 0 0 0 771.302 305.302" fill="none" stroke="#58677c" stroke-width="2" />
<text x="691" y="435" fill="#7b3294" font-size="26" text-anchor="start">負：a・b = −2</text>
<text x="691" y="482" fill="#172b4d" font-size="23" text-anchor="start">a=(-1,1)</text>
<text x="30" y="535" fill="#172b4d" font-size="23" text-anchor="start">X右・Y上。b=(2,0)を固定し、aの向きだけを変える。</text>
</g></svg>
