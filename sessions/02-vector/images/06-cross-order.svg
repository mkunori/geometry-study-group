<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560" role="img" aria-labelledby="title desc">
<title id="title">外積の順序：広さは同じ、向きは反対</title><desc id="desc">同じ右手系でu=(2,0,0)、v=(0,3,0)を示す。左のu×v=(0,0,6)は+Z、右のv×u=(0,0,-6)は−Z。</desc><defs>
<marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#1565c0" /></marker>
<marker id="orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#ba4b00" /></marker>
<marker id="purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#7b3294" /></marker>
<marker id="gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#58677c" /></marker>
</defs><rect width="1000" height="560" fill="white" /><g font-family="Yu Gothic, Meiryo, Noto Sans CJK JP, sans-serif" fill="#172b4d">
<text x="30" y="42" fill="#172b4d" font-size="28" text-anchor="start" font-weight="700">外積の順序：広さは同じ、向きは反対</text>
<polygon points="250,310 334.5,278.8 260.4,226.15 175.9,257.35" fill="#f0e9f5" stroke="#58677c" stroke-width="2" />
<line x1="250" y1="310" x2="376.75" y2="263.2" stroke="#58677c" stroke-width="2" marker-end="url(#gray)" />
<text x="386.75" y="253.2" fill="#172b4d" font-size="22" text-anchor="start">X</text>
<line x1="250" y1="310" x2="151.2" y2="239.8" stroke="#58677c" stroke-width="2" marker-end="url(#gray)" />
<text x="161.2" y="229.8" fill="#172b4d" font-size="22" text-anchor="start">Y</text>
<line x1="250" y1="310" x2="250" y2="137.1" stroke="#58677c" stroke-width="2" marker-end="url(#gray)" />
<text x="260" y="127.1" fill="#172b4d" font-size="22" text-anchor="start">+Z</text>
<line x1="250" y1="310" x2="334.5" y2="278.8" stroke="#1565c0" stroke-width="4" marker-end="url(#blue)" />
<line x1="250" y1="310" x2="175.9" y2="257.35" stroke="#ba4b00" stroke-width="4" marker-end="url(#orange)" />
<line x1="250" y1="310" x2="250" y2="161.8" stroke="#7b3294" stroke-width="5" marker-end="url(#purple)" />
<text x="335" y="292" fill="#1565c0" font-size="24" text-anchor="start">u</text>
<text x="145" y="275" fill="#ba4b00" font-size="24" text-anchor="start">v</text>
<text x="210" y="345" fill="#172b4d" font-size="22" text-anchor="start">O</text>
<text x="45" y="105" fill="#7b3294" font-size="26" text-anchor="start" font-weight="700">u×v = (0,0,6)</text>
<text x="285" y="185" fill="#7b3294" font-size="25" text-anchor="start">+Z</text>
<polygon points="730,310 814.5,278.8 740.4,226.15 655.9,257.35" fill="#f0e9f5" stroke="#58677c" stroke-width="2" />
<line x1="730" y1="310" x2="856.75" y2="263.2" stroke="#58677c" stroke-width="2" marker-end="url(#gray)" />
<text x="866.75" y="253.2" fill="#172b4d" font-size="22" text-anchor="start">X</text>
<line x1="730" y1="310" x2="631.2" y2="239.8" stroke="#58677c" stroke-width="2" marker-end="url(#gray)" />
<text x="641.2" y="229.8" fill="#172b4d" font-size="22" text-anchor="start">Y</text>
<line x1="730" y1="310" x2="730" y2="137.1" stroke="#58677c" stroke-width="2" marker-end="url(#gray)" />
<text x="740" y="127.1" fill="#172b4d" font-size="22" text-anchor="start">+Z</text>
<line x1="730" y1="310" x2="814.5" y2="278.8" stroke="#1565c0" stroke-width="4" marker-end="url(#blue)" />
<line x1="730" y1="310" x2="655.9" y2="257.35" stroke="#ba4b00" stroke-width="4" marker-end="url(#orange)" />
<line x1="730" y1="310" x2="730" y2="458.2" stroke="#7b3294" stroke-width="5" marker-end="url(#purple)" />
<text x="815" y="292" fill="#1565c0" font-size="24" text-anchor="start">u</text>
<text x="625" y="275" fill="#ba4b00" font-size="24" text-anchor="start">v</text>
<text x="690" y="345" fill="#172b4d" font-size="22" text-anchor="start">O</text>
<text x="525" y="105" fill="#7b3294" font-size="26" text-anchor="start" font-weight="700">v×u = (0,0,−6)</text>
<text x="765" y="425" fill="#7b3294" font-size="25" text-anchor="start">−Z</text>
<text x="70" y="510" fill="#172b4d" font-size="25" text-anchor="start">u×v = −(v×u)　　大きさはどちらも6。向きは順序で反転する。</text>
</g></svg>
