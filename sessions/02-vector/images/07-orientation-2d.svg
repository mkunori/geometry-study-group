<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560" role="img" aria-labelledby="title desc">
<title id="title">2Dの左右判定：A→Bを基準にする</title><desc id="desc">X右・Y上、1単位80。A=(1,1)、B=(4,1)、C=(3,3)、C′=(3,-1)、C″=(2,1)。AB=(3,0)とのスカラー外積は順に+6、−6、0。</desc><defs>
<marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#1565c0" /></marker>
<marker id="orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#ba4b00" /></marker>
<marker id="purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#7b3294" /></marker>
<marker id="gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#58677c" /></marker>
</defs><rect width="1000" height="560" fill="white" /><g font-family="Yu Gothic, Meiryo, Noto Sans CJK JP, sans-serif" fill="#172b4d">
<text x="30" y="42" fill="#172b4d" font-size="28" text-anchor="start" font-weight="700">2Dの左右判定：A→Bを基準にする</text>
<line x1="100" y1="365" x2="495" y2="365" stroke="#58677c" stroke-width="2" marker-end="url(#gray)" />
<line x1="100" y1="365" x2="100" y2="95" stroke="#58677c" stroke-width="2" marker-end="url(#gray)" />
<text x="507" y="373" fill="#172b4d" font-size="22" text-anchor="start">X</text>
<text x="80" y="83" fill="#172b4d" font-size="22" text-anchor="start">Y</text>
<text x="74" y="393" fill="#172b4d" font-size="22" text-anchor="start">O</text>
<polygon points="180,285 420,285 340,125" fill="#f0e9f5" stroke="#58677c" stroke-width="2" />
<line x1="135" y1="285" x2="490" y2="285" stroke="#58677c" stroke-width="2" stroke-dasharray="7 6" />
<line x1="180" y1="285" x2="420" y2="285" stroke="#1565c0" stroke-width="5" marker-end="url(#blue)" />
<line x1="180" y1="285" x2="340" y2="125" stroke="#ba4b00" stroke-width="4" marker-end="url(#orange)" />
<line x1="180" y1="285" x2="340" y2="445" stroke="#ba4b00" stroke-width="3" marker-end="url(#orange)" stroke-dasharray="7 6" />
<circle cx="180" cy="285" r="5" fill="#1565c0" data-coordinate="1,1" />
<text x="132" y="263" fill="#1565c0" font-size="24" text-anchor="start">A=(1,1)</text>
<circle cx="420" cy="285" r="5" fill="#1565c0" data-coordinate="4,1" />
<text x="415" y="320" fill="#1565c0" font-size="24" text-anchor="start">B=(4,1)</text>
<circle cx="340" cy="125" r="5" fill="#ba4b00" data-coordinate="3,3" />
<text x="345" y="105" fill="#ba4b00" font-size="24" text-anchor="start">C=(3,3)</text>
<circle cx="340" cy="445" r="5" fill="#ba4b00" data-coordinate="3,-1" />
<text x="320" y="485" fill="#ba4b00" font-size="24" text-anchor="start">C′=(3,−1)</text>
<circle cx="260" cy="285" r="5" fill="#7b3294" data-coordinate="2,1" />
<text x="220" y="320" fill="#7b3294" font-size="24" text-anchor="start">C″=(2,1)</text>
<text x="550" y="130" fill="#172b4d" font-size="26" text-anchor="start" font-weight="700">AB=(3,0) を固定</text>
<text x="550" y="205" fill="#7b3294" font-size="26" text-anchor="start">C：左側 → +6</text>
<text x="550" y="270" fill="#7b3294" font-size="26" text-anchor="start">C′：右側 → −6</text>
<text x="550" y="335" fill="#7b3294" font-size="26" text-anchor="start">C″：直線上 → 0</text>
<text x="550" y="405" fill="#172b4d" font-size="24" text-anchor="start">三角形ABCの面積 = 3</text>
<text x="550" y="470" fill="#172b4d" font-size="23" text-anchor="start">Y下向きなら解釈が反転</text>
<text x="30" y="535" fill="#172b4d" font-size="23" text-anchor="start">外積値0だけでは、線分の内側かどうかは決まらない。</text>
</g></svg>
