<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560" role="img" aria-labelledby="title desc">
<title id="title">内積と正射影：方向成分を取り出す</title><desc id="desc">X右・Y上。1単位65。a=(3,4)、b=(2,0)、q=(3,0)、r=(0,4)。aの先端からbの直線へ垂線を下ろす。</desc><defs>
<marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#1565c0" /></marker>
<marker id="orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#ba4b00" /></marker>
<marker id="purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#7b3294" /></marker>
<marker id="gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#58677c" /></marker>
</defs><rect width="1000" height="560" fill="white" /><g font-family="Yu Gothic, Meiryo, Noto Sans CJK JP, sans-serif" fill="#172b4d">
<text x="30" y="42" fill="#172b4d" font-size="28" text-anchor="start" font-weight="700">内積と正射影：方向成分を取り出す</text>
<polygon points="120,430 315,430 315,170" fill="#f0f5fb" stroke="#58677c" stroke-width="2" />
<line x1="120" y1="430" x2="465" y2="430" stroke="#58677c" stroke-width="2" marker-end="url(#gray)" />
<line x1="120" y1="430" x2="120" y2="100" stroke="#58677c" stroke-width="2" marker-end="url(#gray)" />
<text x="477" y="438" fill="#172b4d" font-size="22" text-anchor="start">X</text>
<text x="100" y="88" fill="#172b4d" font-size="22" text-anchor="start">Y</text>
<text x="94" y="458" fill="#172b4d" font-size="22" text-anchor="start">O</text>
<line x1="315" y1="430" x2="315" y2="170" stroke="#58677c" stroke-width="2" stroke-dasharray="7 6" />
<line x1="120" y1="430" x2="315" y2="170" stroke="#1565c0" stroke-width="4" marker-end="url(#blue)" />
<line x1="120" y1="430" x2="250" y2="430" stroke="#ba4b00" stroke-width="5" marker-end="url(#orange)" />
<line x1="120" y1="478" x2="315" y2="478" stroke="#7b3294" stroke-width="4" marker-end="url(#purple)" />
<line x1="315" y1="430" x2="302" y2="430" stroke="#58677c" stroke-width="2" />
<line x1="302" y1="430" x2="302" y2="417" stroke="#58677c" stroke-width="2" />
<line x1="302" y1="417" x2="315" y2="417" stroke="#58677c" stroke-width="2" />
<circle cx="315" cy="170" r="5" fill="#1565c0" data-coordinate="3,4" />
<text x="250" y="152" fill="#1565c0" font-size="24" text-anchor="start">a=(3,4)</text>
<circle cx="315" cy="430" r="5" fill="#7b3294" data-coordinate="3,0" />
<text x="329" y="450" fill="#7b3294" font-size="24" text-anchor="start">q=(3,0)</text>
<text x="180" y="417" fill="#ba4b00" font-size="24" text-anchor="start">b=(2,0)</text>
<text x="185" y="510" fill="#7b3294" font-size="24" text-anchor="start">射影 q</text>
<text x="335" y="315" fill="#58677c" font-size="24" text-anchor="start">r=(0,4)</text>
<text x="125" y="275" fill="#1565c0" font-size="24" text-anchor="start">長さ5</text>
<text x="240" y="452" fill="#7b3294" font-size="24" text-anchor="start">3</text>
<text x="288" y="310" fill="#58677c" font-size="24" text-anchor="start">4</text>
<text x="540" y="145" fill="#172b4d" font-size="26" text-anchor="start" font-weight="700">a・b = 6、|b|² = 4</text>
<text x="540" y="205" fill="#7b3294" font-size="24" text-anchor="start">q = (6/4)b = (3,0)</text>
<text x="540" y="265" fill="#172b4d" font-size="24" text-anchor="start">a = q + r</text>
<text x="540" y="325" fill="#172b4d" font-size="24" text-anchor="start">r・b = 0：残りは垂直</text>
<text x="540" y="395" fill="#172b4d" font-size="24" text-anchor="start">θ ≈ 53.130102°</text>
<text x="540" y="455" fill="#172b4d" font-size="23" text-anchor="start">射影先はbが張る直線</text>
<text x="540" y="495" fill="#172b4d" font-size="23" text-anchor="start">線分の端(2,0)で止まらない</text>
</g></svg>
