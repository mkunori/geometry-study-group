<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="480" viewBox="0 0 1100 480" role="img" aria-labelledby="title desc">
  <title id="title">単位円：横がcosθ、縦がsinθ</title>
  <desc id="desc">半径1の円。正のX軸から反時計回りの角度θにある点の座標は(cosθ,sinθ)。作図はθ=30度。</desc>
  <defs>
    <marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#1565c0" />
    </marker>
    <marker id="orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#ba4b00" />
    </marker>
    <marker id="purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#7b3294" />
    </marker>
    <marker id="gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#58677c" />
    </marker>
  </defs>
  <rect width="1100" height="100%" fill="white" />
  <g font-family="Yu Gothic, Meiryo, sans-serif" font-size="18" fill="#172b4d">
    <text x="30" y="38" fill="#172b4d" font-size="25" text-anchor="start" font-weight="700">単位円：横がcosθ、縦がsinθ</text>
    <line x1="160" y1="420" x2="160" y2="120" stroke="#e4eaf2" stroke-width="1" />
    <text x="160" y="292" fill="#58677c" font-size="14" text-anchor="middle">-1</text>
    <line x1="310" y1="420" x2="310" y2="120" stroke="#e4eaf2" stroke-width="1" />
    <line x1="460" y1="420" x2="460" y2="120" stroke="#e4eaf2" stroke-width="1" />
    <text x="460" y="292" fill="#58677c" font-size="14" text-anchor="middle">1</text>
    <line x1="160" y1="420" x2="460" y2="420" stroke="#e4eaf2" stroke-width="1" />
    <text x="298" y="425" fill="#58677c" font-size="14" text-anchor="end">-1</text>
    <line x1="160" y1="270" x2="460" y2="270" stroke="#e4eaf2" stroke-width="1" />
    <line x1="160" y1="120" x2="460" y2="120" stroke="#e4eaf2" stroke-width="1" />
    <text x="298" y="125" fill="#58677c" font-size="14" text-anchor="end">1</text>
    <line x1="160" y1="270" x2="490" y2="270" stroke="#58677c" stroke-width="1.5" marker-end="url(#gray)" />
    <line x1="310" y1="420" x2="310" y2="90" stroke="#58677c" stroke-width="1.5" marker-end="url(#gray)" />
    <text x="512.5" y="282" fill="#172b4d" font-size="16" text-anchor="start">X</text>
    <text x="328" y="78" fill="#172b4d" font-size="16" text-anchor="start">Y</text>
    <text x="302" y="292" fill="#172b4d" font-size="14" text-anchor="end">O</text>
    <circle cx="310" cy="270" r="150" fill="none" stroke="#a2b2c7" stroke-width="2" />
    <line x1="310" y1="270" x2="439.904" y2="195" stroke="#ba4b00" stroke-width="3" marker-end="url(#orange)" />
    <line x1="439.904" y1="270" x2="439.904" y2="195" stroke="#ba4b00" stroke-width="2" stroke-dasharray="6 5" />
    <line x1="310" y1="195" x2="439.904" y2="195" stroke="#ba4b00" stroke-width="2" stroke-dasharray="6 5" />
    <circle cx="439.904" cy="195" r="4.5" fill="#ba4b00" data-coordinate="0.866025,0.5" />
    <text x="451.904" y="183" fill="#ba4b00" font-size="17" text-anchor="start">(cosθ, sinθ)</text>
    <path d="M 361 270 A 51 51 0 0 0 354.167 244.5" fill="none" stroke="#ba4b00" stroke-width="2" marker-end="url(#orange)" />
    <text x="370" y="252" fill="#ba4b00" font-size="18" text-anchor="start">θ</text>
    <text x="350" y="298" fill="#ba4b00" font-size="18" text-anchor="start">cosθ</text>
    <text x="460" y="240" fill="#ba4b00" font-size="18" text-anchor="start">sinθ</text>
    <text x="590" y="155" fill="#172b4d" font-size="24" text-anchor="start" font-weight="700">半径 = 1</text>
    <text x="590" y="210" fill="#172b4d" font-size="21" text-anchor="start">θ は正のX軸から反時計回り</text>
    <text x="590" y="263" fill="#172b4d" font-size="21" text-anchor="start">e₁ = (1,0) を θ 回した先</text>
    <text x="590" y="316" fill="#172b4d" font-size="21" text-anchor="start">θ = 90° なら (0,1)</text>
    <text x="590" y="415" fill="#58677c" font-size="17" text-anchor="start">図の作図角度：θ = 30°</text>
  </g>
</svg>
