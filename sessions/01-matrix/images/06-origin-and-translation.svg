<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="470" viewBox="0 0 1100 470" role="img" aria-labelledby="title desc">
  <title id="title">線形変換は原点を固定し、平行移動は原点を動かす</title>
  <desc id="desc">左は2倍拡大A=2Iで原点は原点のまま。右はt=(3,-2)の平行移動で原点が(3,-2)へ移る。</desc>
  <defs>
    <marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#1565c0" />
    </marker>
    <marker id="orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#ba4b00" />
    </marker>
    <marker id="purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#7b3294" />
    </marker>
    <marker id="gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#58677c" />
    </marker>
  </defs>
  <rect width="1100" height="100%" fill="white" />
  <g font-family="Yu Gothic, Meiryo, sans-serif" font-size="18" fill="#172b4d">
    <text x="30" y="38" fill="#172b4d" font-size="25" text-anchor="start" font-weight="700">線形変換は原点を固定し、平行移動は原点を動かす</text>
    <line x1="55" y1="410" x2="55" y2="150" stroke="#e4eaf2" stroke-width="1" />
    <text x="55" y="302" fill="#58677c" font-size="14" text-anchor="middle">-1</text>
    <line x1="120" y1="410" x2="120" y2="150" stroke="#e4eaf2" stroke-width="1" />
    <line x1="185" y1="410" x2="185" y2="150" stroke="#e4eaf2" stroke-width="1" />
    <text x="185" y="302" fill="#58677c" font-size="14" text-anchor="middle">1</text>
    <line x1="250" y1="410" x2="250" y2="150" stroke="#e4eaf2" stroke-width="1" />
    <text x="250" y="302" fill="#58677c" font-size="14" text-anchor="middle">2</text>
    <line x1="315" y1="410" x2="315" y2="150" stroke="#e4eaf2" stroke-width="1" />
    <text x="315" y="302" fill="#58677c" font-size="14" text-anchor="middle">3</text>
    <line x1="380" y1="410" x2="380" y2="150" stroke="#e4eaf2" stroke-width="1" />
    <text x="380" y="302" fill="#58677c" font-size="14" text-anchor="middle">4</text>
    <line x1="55" y1="410" x2="380" y2="410" stroke="#e4eaf2" stroke-width="1" />
    <text x="108" y="415" fill="#58677c" font-size="14" text-anchor="end">-2</text>
    <line x1="55" y1="345" x2="380" y2="345" stroke="#e4eaf2" stroke-width="1" />
    <text x="108" y="350" fill="#58677c" font-size="14" text-anchor="end">-1</text>
    <line x1="55" y1="280" x2="380" y2="280" stroke="#e4eaf2" stroke-width="1" />
    <line x1="55" y1="215" x2="380" y2="215" stroke="#e4eaf2" stroke-width="1" />
    <text x="108" y="220" fill="#58677c" font-size="14" text-anchor="end">1</text>
    <line x1="55" y1="150" x2="380" y2="150" stroke="#e4eaf2" stroke-width="1" />
    <text x="108" y="155" fill="#58677c" font-size="14" text-anchor="end">2</text>
    <line x1="55" y1="280" x2="393" y2="280" stroke="#58677c" stroke-width="1.5" marker-end="url(#gray)" />
    <line x1="120" y1="410" x2="120" y2="137" stroke="#58677c" stroke-width="1.5" marker-end="url(#gray)" />
    <text x="402.75" y="285.2" fill="#172b4d" font-size="16" text-anchor="start">X</text>
    <text x="127.8" y="131.8" fill="#172b4d" font-size="16" text-anchor="start">Y</text>
    <text x="112" y="302" fill="#172b4d" font-size="14" text-anchor="end">O</text>
    <text x="40" y="90" fill="#172b4d" font-size="18" text-anchor="start" font-weight="700">線形変換の例：A = 2I</text>
    <polygon points="120,280 185,280 120,215" stroke="#1565c0" stroke-width="2.5" fill="#1565c0" fill-opacity="0.08" stroke-dasharray="6 5" />
    <polygon points="120,280 250,280 120,150" stroke="#ba4b00" stroke-width="2.5" fill="#ba4b00" fill-opacity="0.08" />
    <circle cx="120" cy="280" r="4.5" fill="#ba4b00" data-coordinate="0,0" />
    <text x="160" y="332" fill="#ba4b00" font-size="17" text-anchor="start">O → O</text>
    <text x="40" y="447" fill="#172b4d" font-size="22" text-anchor="start">A(0,0) = (0,0)</text>
    <line x1="605" y1="410" x2="605" y2="135" stroke="#e4eaf2" stroke-width="1" />
    <text x="605" y="263.615" fill="#58677c" font-size="14" text-anchor="middle">-1</text>
    <line x1="660" y1="410" x2="660" y2="135" stroke="#e4eaf2" stroke-width="1" />
    <line x1="715" y1="410" x2="715" y2="135" stroke="#e4eaf2" stroke-width="1" />
    <text x="715" y="263.615" fill="#58677c" font-size="14" text-anchor="middle">1</text>
    <line x1="770" y1="410" x2="770" y2="135" stroke="#e4eaf2" stroke-width="1" />
    <text x="770" y="263.615" fill="#58677c" font-size="14" text-anchor="middle">2</text>
    <line x1="825" y1="410" x2="825" y2="135" stroke="#e4eaf2" stroke-width="1" />
    <text x="825" y="263.615" fill="#58677c" font-size="14" text-anchor="middle">3</text>
    <line x1="880" y1="410" x2="880" y2="135" stroke="#e4eaf2" stroke-width="1" />
    <text x="880" y="263.615" fill="#58677c" font-size="14" text-anchor="middle">4</text>
    <line x1="935" y1="410" x2="935" y2="135" stroke="#e4eaf2" stroke-width="1" />
    <text x="935" y="263.615" fill="#58677c" font-size="14" text-anchor="middle">5</text>
    <line x1="605" y1="410" x2="935" y2="410" stroke="#e4eaf2" stroke-width="1" />
    <text x="649.846" y="414.231" fill="#58677c" font-size="14" text-anchor="end">-3</text>
    <line x1="605" y1="355" x2="935" y2="355" stroke="#e4eaf2" stroke-width="1" />
    <text x="649.846" y="359.231" fill="#58677c" font-size="14" text-anchor="end">-2</text>
    <line x1="605" y1="300" x2="935" y2="300" stroke="#e4eaf2" stroke-width="1" />
    <text x="649.846" y="304.231" fill="#58677c" font-size="14" text-anchor="end">-1</text>
    <line x1="605" y1="245" x2="935" y2="245" stroke="#e4eaf2" stroke-width="1" />
    <line x1="605" y1="190" x2="935" y2="190" stroke="#e4eaf2" stroke-width="1" />
    <text x="649.846" y="194.231" fill="#58677c" font-size="14" text-anchor="end">1</text>
    <line x1="605" y1="135" x2="935" y2="135" stroke="#e4eaf2" stroke-width="1" />
    <text x="649.846" y="139.231" fill="#58677c" font-size="14" text-anchor="end">2</text>
    <line x1="605" y1="245" x2="946" y2="245" stroke="#58677c" stroke-width="1.5" marker-end="url(#gray)" />
    <line x1="660" y1="410" x2="660" y2="124" stroke="#58677c" stroke-width="1.5" marker-end="url(#gray)" />
    <text x="954.25" y="249.4" fill="#172b4d" font-size="16" text-anchor="start">X</text>
    <text x="666.6" y="119.6" fill="#172b4d" font-size="16" text-anchor="start">Y</text>
    <text x="653.231" y="263.615" fill="#172b4d" font-size="14" text-anchor="end">O</text>
    <text x="585" y="90" fill="#172b4d" font-size="18" text-anchor="start" font-weight="700">平行移動：t = (3,−2)</text>
    <circle cx="660" cy="245" r="4.5" fill="#1565c0" data-coordinate="0,0" />
    <text x="668.462" y="234.846" fill="#1565c0" font-size="17" text-anchor="start">O=(0,0)</text>
    <line x1="660" y1="245" x2="825" y2="355" stroke="#7b3294" stroke-width="3" marker-end="url(#purple)" />
    <circle cx="825" cy="355" r="4.5" fill="#ba4b00" data-coordinate="3,-2" />
    <text x="833.462" y="344.846" fill="#ba4b00" font-size="17" text-anchor="start">O′=(3,−2)</text>
    <text x="585" y="447" fill="#172b4d" font-size="22" text-anchor="start">O′ ≠ O → 2×2行列では表せない</text>
  </g>
</svg>
