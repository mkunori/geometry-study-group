<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="510" viewBox="0 0 1100 510" role="img" aria-labelledby="title desc">
<title id="title">位置は動くが、2点の差は変わらない</title>
<desc id="desc">P=(0,0),Q=(2,1)をt=(3,-2)で平行移動。Pprime=(3,-2),Qprime=(5,-1)で、差はどちらも(2,1)。</desc>
<defs>
<marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#1565c0"/></marker>
<marker id="orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#ba4b00"/></marker>
<marker id="purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#7b3294"/></marker>
<marker id="gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#58677c"/></marker>
</defs>
<rect width="1100" height="100%" fill="white"/>
<g font-family="Yu Gothic, Meiryo, sans-serif" font-size="18" fill="#172b4d">
<text x="30" y="38" fill="#172b4d" font-size="25" text-anchor="start" font-weight="700">位置は動くが、2点の差は変わらない</text>
<line x1="75" y1="455" x2="75" y2="130" stroke="#e4eaf2" stroke-width="1"/>
<text x="75" y="282" fill="#58677c" font-size="14" text-anchor="middle">-1</text>
<line x1="140" y1="455" x2="140" y2="130" stroke="#e4eaf2" stroke-width="1"/>
<line x1="205" y1="455" x2="205" y2="130" stroke="#e4eaf2" stroke-width="1"/>
<text x="205" y="282" fill="#58677c" font-size="14" text-anchor="middle">1</text>
<line x1="270" y1="455" x2="270" y2="130" stroke="#e4eaf2" stroke-width="1"/>
<text x="270" y="282" fill="#58677c" font-size="14" text-anchor="middle">2</text>
<line x1="335" y1="455" x2="335" y2="130" stroke="#e4eaf2" stroke-width="1"/>
<text x="335" y="282" fill="#58677c" font-size="14" text-anchor="middle">3</text>
<line x1="400" y1="455" x2="400" y2="130" stroke="#e4eaf2" stroke-width="1"/>
<text x="400" y="282" fill="#58677c" font-size="14" text-anchor="middle">4</text>
<line x1="465" y1="455" x2="465" y2="130" stroke="#e4eaf2" stroke-width="1"/>
<text x="465" y="282" fill="#58677c" font-size="14" text-anchor="middle">5</text>
<line x1="530" y1="455" x2="530" y2="130" stroke="#e4eaf2" stroke-width="1"/>
<text x="530" y="282" fill="#58677c" font-size="14" text-anchor="middle">6</text>
<line x1="75" y1="455" x2="530" y2="455" stroke="#e4eaf2" stroke-width="1"/>
<text x="128" y="460" fill="#58677c" font-size="14" text-anchor="end">-3</text>
<line x1="75" y1="390" x2="530" y2="390" stroke="#e4eaf2" stroke-width="1"/>
<text x="128" y="395" fill="#58677c" font-size="14" text-anchor="end">-2</text>
<line x1="75" y1="325" x2="530" y2="325" stroke="#e4eaf2" stroke-width="1"/>
<text x="128" y="330" fill="#58677c" font-size="14" text-anchor="end">-1</text>
<line x1="75" y1="260" x2="530" y2="260" stroke="#e4eaf2" stroke-width="1"/>
<line x1="75" y1="195" x2="530" y2="195" stroke="#e4eaf2" stroke-width="1"/>
<text x="128" y="200" fill="#58677c" font-size="14" text-anchor="end">1</text>
<line x1="75" y1="130" x2="530" y2="130" stroke="#e4eaf2" stroke-width="1"/>
<text x="128" y="135" fill="#58677c" font-size="14" text-anchor="end">2</text>
<line x1="75" y1="260" x2="543" y2="260" stroke="#58677c" stroke-width="1.5" marker-end="url(#gray)"/>
<line x1="140" y1="455" x2="140" y2="117" stroke="#58677c" stroke-width="1.5" marker-end="url(#gray)"/>
<text x="552.75" y="265.2" fill="#172b4d" font-size="16" text-anchor="start">X</text>
<text x="147.8" y="111.8" fill="#172b4d" font-size="16" text-anchor="start">Y</text>
<text x="132" y="282" fill="#172b4d" font-size="14" text-anchor="end">O</text>
<line x1="140" y1="260" x2="270" y2="195" stroke="#1565c0" stroke-width="3" marker-end="url(#blue)"/>
<line x1="335" y1="390" x2="465" y2="325" stroke="#ba4b00" stroke-width="3" marker-end="url(#orange)"/>
<line x1="140" y1="260" x2="335" y2="390" stroke="#7b3294" stroke-width="3" stroke-dasharray="6 5" marker-end="url(#purple)"/>
<line x1="270" y1="195" x2="465" y2="325" stroke="#7b3294" stroke-width="3" stroke-dasharray="6 5" marker-end="url(#purple)"/>
<circle cx="140" cy="260" r="4.5" fill="#1565c0" data-coordinate="0,0"/>
<text x="128" y="248" fill="#1565c0" font-size="17" text-anchor="end">P=(0,0)</text>
<circle cx="270" cy="195" r="4.5" fill="#1565c0" data-coordinate="2,1"/>
<text x="280" y="185" fill="#1565c0" font-size="17" text-anchor="start">Q=(2,1)</text>
<circle cx="335" cy="390" r="4.5" fill="#ba4b00" data-coordinate="3,-2"/>
<text x="330" y="419" fill="#ba4b00" font-size="17" text-anchor="start">P′=(3,−2)</text>
<circle cx="465" cy="325" r="4.5" fill="#ba4b00" data-coordinate="5,-1"/>
<text x="477" y="333" fill="#ba4b00" font-size="17" text-anchor="start">Q′=(5,−1)</text>
<text x="655" y="150" fill="#7b3294" font-size="23" text-anchor="start">t = (3,−2)</text>
<text x="655" y="220" fill="#1565c0" font-size="23" text-anchor="start">Q − P = (2,1)</text>
<text x="655" y="280" fill="#ba4b00" font-size="23" text-anchor="start">Q′ − P′ = (2,1)</text>
<text x="655" y="350" fill="#172b4d" font-size="22" text-anchor="start">方向：w = 1 − 1 = 0</text>
<text x="40" y="482" fill="#172b4d" font-size="19" text-anchor="start">実線：2点の差　　紫の破線：両方の点に加える、同じ平行移動</text>
</g>
</svg>
