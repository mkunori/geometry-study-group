<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="470" viewBox="0 0 1100 470" role="img" aria-labelledby="title desc">
  <title id="title">点 (2,1) を、原点周りに90°回転する</title>
  <desc id="desc">X右・Y上で反時計回り。点(2,1)は(-1,2)へ。どちらも原点からの距離は√5。</desc>
  <defs>
    <marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#1565c0" />
    </marker>
    <marker id="orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#ba4b00" />
    </marker>
    <marker id="purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#7b3294" />
    </marker>
    <marker id="gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#58677c" />
    </marker>
  </defs>
  <rect width="1100" height="100%" fill="white" />
  <g font-family="Yu Gothic, Meiryo, sans-serif" font-size="18" fill="#172b4d">
    <text x="30" y="38" fill="#172b4d" font-size="25" text-anchor="start" font-weight="700">点 (2,1) を、原点周りに90°回転する</text>
    <line x1="120" y1="435" x2="120" y2="75" stroke="#e4eaf2" stroke-width="1" />
    <text x="120" y="367" fill="#58677c" font-size="14" text-anchor="middle">-2</text>
    <line x1="210" y1="435" x2="210" y2="75" stroke="#e4eaf2" stroke-width="1" />
    <text x="210" y="367" fill="#58677c" font-size="14" text-anchor="middle">-1</text>
    <line x1="300" y1="435" x2="300" y2="75" stroke="#e4eaf2" stroke-width="1" />
    <line x1="390" y1="435" x2="390" y2="75" stroke="#e4eaf2" stroke-width="1" />
    <text x="390" y="367" fill="#58677c" font-size="14" text-anchor="middle">1</text>
    <line x1="480" y1="435" x2="480" y2="75" stroke="#e4eaf2" stroke-width="1" />
    <text x="480" y="367" fill="#58677c" font-size="14" text-anchor="middle">2</text>
    <line x1="570" y1="435" x2="570" y2="75" stroke="#e4eaf2" stroke-width="1" />
    <text x="570" y="367" fill="#58677c" font-size="14" text-anchor="middle">3</text>
    <line x1="120" y1="435" x2="570" y2="435" stroke="#e4eaf2" stroke-width="1" />
    <text x="288" y="440" fill="#58677c" font-size="14" text-anchor="end">-1</text>
    <line x1="120" y1="345" x2="570" y2="345" stroke="#e4eaf2" stroke-width="1" />
    <line x1="120" y1="255" x2="570" y2="255" stroke="#e4eaf2" stroke-width="1" />
    <text x="288" y="260" fill="#58677c" font-size="14" text-anchor="end">1</text>
    <line x1="120" y1="165" x2="570" y2="165" stroke="#e4eaf2" stroke-width="1" />
    <text x="288" y="170" fill="#58677c" font-size="14" text-anchor="end">2</text>
    <line x1="120" y1="75" x2="570" y2="75" stroke="#e4eaf2" stroke-width="1" />
    <text x="288" y="80" fill="#58677c" font-size="14" text-anchor="end">3</text>
    <line x1="120" y1="345" x2="588" y2="345" stroke="#58677c" stroke-width="1.5" marker-end="url(#gray)" />
    <line x1="300" y1="435" x2="300" y2="57" stroke="#58677c" stroke-width="1.5" marker-end="url(#gray)" />
    <text x="601.5" y="352.2" fill="#172b4d" font-size="16" text-anchor="start">X</text>
    <text x="310.8" y="68" fill="#172b4d" font-size="16" text-anchor="start">Y</text>
    <text x="292" y="367" fill="#172b4d" font-size="14" text-anchor="end">O</text>
    <line x1="300" y1="345" x2="480" y2="255" stroke="#1565c0" stroke-width="3" marker-end="url(#blue)" />
    <line x1="300" y1="345" x2="210" y2="165" stroke="#ba4b00" stroke-width="3" marker-end="url(#orange)" />
    <circle cx="480" cy="255" r="4.5" fill="#1565c0" data-coordinate="2,1" />
    <text x="490" y="245" fill="#1565c0" font-size="17" text-anchor="start">p=(2,1)</text>
    <circle cx="210" cy="165" r="4.5" fill="#ba4b00" data-coordinate="-1,2" />
    <text x="200" y="153" fill="#ba4b00" font-size="17" text-anchor="end">Rp=(−1,2)</text>
    <path d="M 400.623 294.688 A 112.5 112.5 0 0 0 249.688 244.377" fill="none" stroke="#ba4b00" stroke-width="2" marker-end="url(#orange)" />
    <text x="325" y="210" fill="#ba4b00" font-size="22" text-anchor="start">+90°</text>
    <text x="660" y="155" fill="#172b4d" font-size="22" text-anchor="start">R(90°) = [[0, −1], [1, 0]]</text>
    <text x="660" y="222" fill="#1565c0" font-size="22" text-anchor="start">右に2・上に1</text>
    <text x="660" y="265" fill="#ba4b00" font-size="22" text-anchor="start">→ 上に2・左に1</text>
    <text x="660" y="340" fill="#172b4d" font-size="19" text-anchor="start">原点からの距離は変わらない</text>
    <text x="35" y="445" fill="#172b4d" font-size="18" text-anchor="start">正の角度：反時計回り　　回転の中心：原点O</text>
  </g>
</svg>
