<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="620" viewBox="0 0 1000 620" role="img" aria-labelledby="title desc" style="font-family:Yu Gothic,Meiryo,Noto Sans CJK JP,sans-serif">
  <title id="title">同じ頂点を、どの座標系で測っている？</title>
  <desc id="desc">OCSの非対称輪郭0,0から4,0、3,2、0,1と、固定例BのWCS位置を同じ頂点番号で対応させる。右は数学上の斜投影で、長さや角度の見かけは実寸ではない。</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto-start-reverse">
      <path d="M0,0 L8,4 L0,8 Z" fill="context-stroke"/>
    </marker>
  </defs>
  <rect width="1000" height="620" fill="#ffffff"/>
  <text x="30" y="42" font-size="27" fill="#21324b" text-anchor="start">同じ頂点を、どの座標系で測っている？</text>
  <text x="60" y="100" font-size="23" fill="#21324b" text-anchor="start">共通のOCS頂点（u,v）</text>
  <text x="555" y="100" font-size="23" fill="#21324b" text-anchor="start">固定例BをWCSで見る（斜投影）</text>
  <polygon points="85.000,390.000 293.000,390.000 241.000,286.000 85.000,338.000" fill="#2264bc" fill-opacity="0.12" stroke="#2264bc" stroke-width="3"/>
  <line x1="85.000" y1="390.000" x2="319.000" y2="390.000" stroke="#60738a" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="85.000" y1="390.000" x2="85.000" y2="213.200" stroke="#60738a" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="330" y="435" font-size="22" fill="#21324b" text-anchor="start">u</text>
  <text x="70" y="200" font-size="22" fill="#21324b" text-anchor="start">v</text>
  <circle cx="85.000" cy="390.000" r="5" fill="#8053b5"/>
  <text x="8" y="420" font-size="18" fill="#21324b" text-anchor="start">0: (0, 0)</text>
  <circle cx="293.000" cy="390.000" r="5" fill="#8053b5"/>
  <text x="301" y="380" font-size="18" fill="#21324b" text-anchor="start">1: (4, 0)</text>
  <circle cx="241.000" cy="286.000" r="5" fill="#8053b5"/>
  <text x="249" y="276" font-size="18" fill="#21324b" text-anchor="start">2: (3, 2)</text>
  <circle cx="85.000" cy="338.000" r="5" fill="#8053b5"/>
  <text x="95" y="365" font-size="18" fill="#21324b" text-anchor="start">3: (0, 1)</text>
  <line x1="375.000" y1="285.000" x2="500.000" y2="285.000" stroke="#7650a4" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="375" y="250" font-size="19" fill="#21324b" text-anchor="start">軸と高さを</text>
  <text x="375" y="275" font-size="19" fill="#21324b" text-anchor="start">考慮する</text>
  <polygon points="710.000,387.500 550.000,317.500 638.000,239.000 734.000,339.500" fill="#087f81" fill-opacity="0.12" stroke="#087f81" stroke-width="3"/>
  <circle cx="710.000" cy="387.500" r="5" fill="#8053b5"/>
  <text x="718.0" y="377.5" font-size="19" fill="#21324b" text-anchor="start">0</text>
  <circle cx="550.000" cy="317.500" r="5" fill="#8053b5"/>
  <text x="558.0" y="307.5" font-size="19" fill="#21324b" text-anchor="start">1</text>
  <circle cx="638.000" cy="239.000" r="5" fill="#8053b5"/>
  <text x="646.0" y="229.0" font-size="19" fill="#21324b" text-anchor="start">2</text>
  <circle cx="734.000" cy="339.500" r="5" fill="#8053b5"/>
  <text x="742.0" y="329.5" font-size="19" fill="#21324b" text-anchor="start">3</text>
  <line x1="800.000" y1="520.000" x2="900.000" y2="563.750" stroke="#60738a" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="910" y="567" font-size="17" fill="#21324b" text-anchor="start">WCS X</text>
  <line x1="800.000" y1="520.000" x2="725.000" y2="576.250" stroke="#60738a" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="694" y="585" font-size="17" fill="#21324b" text-anchor="start">WCS Y</text>
  <line x1="800.000" y1="520.000" x2="800.000" y2="395.000" stroke="#60738a" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="813" y="400" font-size="17" fill="#21324b" text-anchor="start">WCS Z</text>
  <line x1="800.000" y1="520.000" x2="710.000" y2="387.500" stroke="#9d43a6" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="755" y="448" font-size="21" fill="#21324b" text-anchor="start">5N</text>
  <text x="555" y="150" font-size="21" fill="#21324b" text-anchor="start">N=(0,3/5,4/5), h=5</text>
  <text x="555" y="180" font-size="23" fill="#8053b5" text-anchor="start">頂点2 → (−3,1.4,5.2)</text>
  <text x="55" y="475" font-size="21" fill="#21324b" text-anchor="start">固定例A：N=+Z, h=0</text>
  <text x="55" y="510" font-size="22" fill="#21324b" text-anchor="start">頂点2 → WCS (3,2,0)</text>
  <text x="55" y="550" font-size="20" fill="#21324b" text-anchor="start">同じOCS (3,2)でも、WCSの成分は変わる。</text>
</svg>
