<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="620" viewBox="0 0 1000 620" role="img" aria-labelledby="title desc" style="font-family:Yu Gothic,Meiryo,Noto Sans CJK JP,sans-serif">
  <title id="title">法線だけでは、平面内の2軸は一意に決まらない</title>
  <desc id="desc">正Z側から原点を見る。右の基底は左のX・Y軸を反時計回りに90度回したもの。同じ座標3,2は別のWCS位置を表す。両者とも右手系だが、AutoCADのOCS規則は左を選ぶ。</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto-start-reverse">
      <path d="M0,0 L8,4 L0,8 Z" fill="context-stroke"/>
    </marker>
  </defs>
  <rect width="1000" height="620" fill="#ffffff"/>
  <text x="30" y="42" font-size="27" fill="#21324b" text-anchor="start">法線だけでは、平面内の2軸は一意に決まらない</text>
  <text x="50" y="105" font-size="23" fill="#21324b" text-anchor="start">AutoCADが選ぶOCS（N=+Z）</text>
  <text x="545" y="105" font-size="23" fill="#21324b" text-anchor="start">数学的には有効な、別の基底</text>
  <circle cx="220" cy="380" r="145" fill="#f6f8fb" stroke="#c1cad6"/>
  <line x1="220.000" y1="380.000" x2="395.000" y2="380.000" stroke="#2264bc" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="385" y="410" font-size="22" fill="#21324b" text-anchor="start">Ax</text>
  <line x1="220.000" y1="380.000" x2="220.000" y2="205.000" stroke="#2264bc" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="235" y="205" font-size="22" fill="#21324b" text-anchor="start">Ay</text>
  <circle cx="340.000" cy="300.000" r="5" fill="#8053b5"/>
  <text x="320" y="285" font-size="19" fill="#8053b5" text-anchor="start">(u,v)=(3,2)</text>
  <circle cx="220" cy="380" r="12" fill="white" stroke="#cf6b15" stroke-width="2"/>
  <circle cx="220.000" cy="380.000" r="4" fill="#cf6b15"/>
  <text x="240" y="405" font-size="17" fill="#21324b" text-anchor="start">N：紙面の手前へ</text>
  <text x="70" y="500" font-size="23" fill="#21324b" text-anchor="start">WCS (3,2,0)</text>
  <circle cx="740" cy="380" r="145" fill="#f6f8fb" stroke="#c1cad6"/>
  <line x1="740.000" y1="380.000" x2="740.000" y2="205.000" stroke="#2264bc" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="755" y="205" font-size="22" fill="#21324b" text-anchor="start">A'x</text>
  <line x1="740.000" y1="380.000" x2="565.000" y2="380.000" stroke="#2264bc" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="555" y="410" font-size="22" fill="#21324b" text-anchor="start">A'y</text>
  <circle cx="660.000" cy="260.000" r="5" fill="#8053b5"/>
  <text x="640" y="245" font-size="19" fill="#8053b5" text-anchor="start">(u,v)=(3,2)</text>
  <circle cx="740" cy="380" r="12" fill="white" stroke="#cf6b15" stroke-width="2"/>
  <circle cx="740.000" cy="380.000" r="4" fill="#cf6b15"/>
  <text x="760" y="405" font-size="17" fill="#21324b" text-anchor="start">N：紙面の手前へ</text>
  <text x="590" y="500" font-size="23" fill="#21324b" text-anchor="start">WCS (−2,3,0)</text>
  <text x="45" y="560" font-size="22" fill="#21324b" text-anchor="start">同じ法線でも、平面内の軸には回転の自由度がある。</text>
  <text x="45" y="594" font-size="20" fill="#21324b" text-anchor="start">AutoCADは任意軸アルゴリズムで一組を選ぶ。数学的な一意性とは別。</text>
</svg>
