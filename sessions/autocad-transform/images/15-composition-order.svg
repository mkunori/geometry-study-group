<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="620" viewBox="0 0 1000 620" role="img" aria-labelledby="title desc">
  <title id="title">TRとRT：掛ける位置で、操作の順序が変わる</title>
  <desc id="desc">WCSのXY投影で2つの経路を示す。TRは(3,2,0)→(-2,3,0)→(8,3,3)、RTは(3,2,0)→(13,2,3)→(-2,13,3)。Zはラベルに保持し、表示上だけXYへ投影している。</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse" markerUnits="userSpaceOnUse">
      <path d="M0,0 L7,4 L0,8 Z" fill="context-stroke"/>
    </marker>
  </defs>
  <rect width="1000" height="620" fill="white"/>
  <g font-family="Yu Gothic, Meiryo, Noto Sans CJK JP, sans-serif">
    <text x="30" y="43" font-size="27" fill="#21324b" text-anchor="start">TRとRT：掛ける位置で、操作の順序が変わる</text>
    <text x="35" y="90" font-size="22" fill="#21324b" text-anchor="start">同じ入力P=(3,2,0)。Tは(10,0,3)、Rは原点の+π/2回転。</text>
    <rect x="20" y="115" width="465" height="385" rx="8" fill="#f6f8fb" stroke="#c7d1df"/>
    <text x="38" y="150" font-size="24" fill="#bd372c" text-anchor="start">回転 → 移動：TR</text>
    <line x1="101.000" y1="420.000" x2="407.000" y2="420.000" stroke="#60738a" stroke-width="1.2" marker-end="url(#arrow)"/>
    <line x1="155.000" y1="438.000" x2="155.000" y2="168.000" stroke="#60738a" stroke-width="1.2" marker-end="url(#arrow)"/>
    <circle cx="209.000" cy="384.000" r="5" fill="#60738a" data-world="3,2,0" data-origin="155,420" data-scale="18" data-projection="xy"/>
    <text x="217" y="404" font-size="21" fill="#60738a" text-anchor="start">P</text>
    <circle cx="119.000" cy="366.000" r="5" fill="#2264bc" data-world="-2,3,0" data-origin="155,420" data-scale="18" data-projection="xy"/>
    <text x="49" y="351" font-size="21" fill="#2264bc" text-anchor="start">(−2,3,0)</text>
    <circle cx="299.000" cy="366.000" r="5" fill="#bd372c" data-world="8,3,3" data-origin="155,420" data-scale="18" data-projection="xy"/>
    <text x="307" y="351" font-size="21" fill="#bd372c" text-anchor="start">(8,3,3)</text>
    <line x1="209.000" y1="384.000" x2="119.000" y2="366.000" stroke="#2264bc" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="119.000" y1="366.000" x2="299.000" y2="366.000" stroke="#bd372c" stroke-width="2.5" marker-end="url(#arrow)"/>
    <text x="38" y="475" font-size="22" fill="#bd372c" text-anchor="start">先にR、次にT</text>
    <rect x="510" y="115" width="465" height="385" rx="8" fill="#f6f8fb" stroke="#c7d1df"/>
    <text x="528" y="150" font-size="24" fill="#a1439d" text-anchor="start">移動 → 回転：RT</text>
    <line x1="591.000" y1="420.000" x2="897.000" y2="420.000" stroke="#60738a" stroke-width="1.2" marker-end="url(#arrow)"/>
    <line x1="645.000" y1="438.000" x2="645.000" y2="168.000" stroke="#60738a" stroke-width="1.2" marker-end="url(#arrow)"/>
    <circle cx="699.000" cy="384.000" r="5" fill="#60738a" data-world="3,2,0" data-origin="645,420" data-scale="18" data-projection="xy"/>
    <text x="707" y="404" font-size="21" fill="#60738a" text-anchor="start">P</text>
    <circle cx="879.000" cy="384.000" r="5" fill="#2264bc" data-world="13,2,3" data-origin="645,420" data-scale="18" data-projection="xy"/>
    <text x="809" y="369" font-size="21" fill="#2264bc" text-anchor="start">(13,2,3)</text>
    <circle cx="609.000" cy="186.000" r="5" fill="#a1439d" data-world="-2,13,3" data-origin="645,420" data-scale="18" data-projection="xy"/>
    <text x="617" y="216" font-size="21" fill="#a1439d" text-anchor="start">(−2,13,3)</text>
    <line x1="699.000" y1="384.000" x2="879.000" y2="384.000" stroke="#2264bc" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="879.000" y1="384.000" x2="609.000" y2="186.000" stroke="#a1439d" stroke-width="2.5" marker-end="url(#arrow)"/>
    <text x="528" y="475" font-size="22" fill="#a1439d" text-anchor="start">先にT、次にR</text>
    <text x="35" y="547" font-size="24" fill="#21324b" text-anchor="start">列方式では、積の右端が最初に作用する。</text>
    <text x="35" y="589" font-size="21" fill="#21324b" text-anchor="start">WCSのXY投影。高さZは各点のラベルで示す。灰色は出発点。</text>
  </g>
</svg>
