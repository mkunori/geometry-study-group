<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="620" viewBox="0 0 1000 620" role="img" aria-labelledby="title desc">
  <title id="title">同じ点でも、原点と軸が違えば座標が変わる</title>
  <desc id="desc">固定例BのWCS点P=(-3,1.4,5.2)を動かさず3つの座標系で測る。UCSは原点(1,0,0)、X=+WCS Y、Y=-WCS X、Z=+WCS Zを選び(1.4,4,5.2)。OCSは原点Oと任意軸の3軸で(3,2,5)。全パネルで同じWCS座標の斜投影を使う。</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse">
      <path d="M0,0 L7,4 L0,8 Z" fill="context-stroke"/>
    </marker>
  </defs>
  <rect width="1000" height="620" fill="white"/>
  <g font-family="Yu Gothic, Meiryo, Noto Sans CJK JP, sans-serif">
    <text x="30.000" y="43.000" font-size="27" fill="#21324b" text-anchor="start">同じ点でも、原点と軸が違えば座標が変わる</text>
    <text x="35.000" y="87.000" font-size="23" fill="#21324b" text-anchor="start">点Pは動かさず、どの原点・軸から測るかを変える。</text>
    <rect x="20" y="110" width="310" height="430" rx="8" fill="#f6f8fb" stroke="#c7d1df"/>
    <text x="34.000" y="144.000" font-size="21" fill="#21324b" text-anchor="start">WCS：図面の基準</text>
    <circle cx="136.320" cy="160.160" r="4" fill="#23743d"/>
    <text x="128.320" y="188.160" font-size="20" fill="#23743d" text-anchor="start">同じP</text>
    <line x1="240.000" y1="340.000" x2="136.320" y2="160.160" stroke="#21324b" stroke-width="1.6" stroke-dasharray="6 5"/>
    <line x1="240.000" y1="340.000" x2="286.080" y2="360.160" stroke="#60738a" stroke-width="2.5" marker-end="url(#arrow)"/>
    <text x="293.080" y="376.160" font-size="19" fill="#60738a" text-anchor="start">X</text>
    <line x1="240.000" y1="340.000" x2="205.440" y2="365.920" stroke="#60738a" stroke-width="2.5" marker-end="url(#arrow)"/>
    <text x="178.440" y="383.920" font-size="19" fill="#60738a" text-anchor="start">Y</text>
    <line x1="240.000" y1="340.000" x2="240.000" y2="282.400" stroke="#60738a" stroke-width="2.5" marker-end="url(#arrow)"/>
    <text x="248.000" y="277.400" font-size="19" fill="#60738a" text-anchor="start">Z</text>
    <circle cx="240.000" cy="340.000" r="4" fill="#21324b"/>
    <text x="247.000" y="368.000" font-size="20" fill="#21324b" text-anchor="start">O</text>
    <text x="35.000" y="424.000" font-size="20" fill="#21324b" text-anchor="start">O=(0,0,0) が原点</text>
    <text x="35.000" y="463.000" font-size="20" fill="#21324b" text-anchor="start">Pの座標</text>
    <text x="35.000" y="503.000" font-size="24" fill="#21324b" text-anchor="start">(−3,1.4,5.2)</text>
    <rect x="350" y="110" width="310" height="430" rx="8" fill="#f6f8fb" stroke="#c7d1df"/>
    <text x="364.000" y="144.000" font-size="21" fill="#21324b" text-anchor="start">UCS：作業用の基準</text>
    <circle cx="466.320" cy="160.160" r="4" fill="#23743d"/>
    <text x="458.320" y="188.160" font-size="20" fill="#23743d" text-anchor="start">同じP</text>
    <line x1="595.600" y1="351.200" x2="466.320" y2="160.160" stroke="#21324b" stroke-width="1.6" stroke-dasharray="6 5"/>
    <line x1="595.600" y1="351.200" x2="561.040" y2="377.120" stroke="#60738a" stroke-width="2.5" marker-end="url(#arrow)" stroke-dasharray="6 5"/>
    <text x="519.040" y="367.120" font-size="19" fill="#60738a" text-anchor="start">X</text>
    <line x1="595.600" y1="351.200" x2="549.520" y2="331.040" stroke="#60738a" stroke-width="2.5" marker-end="url(#arrow)" stroke-dasharray="6 5"/>
    <text x="529.520" y="323.040" font-size="19" fill="#60738a" text-anchor="start">Y</text>
    <line x1="595.600" y1="351.200" x2="595.600" y2="293.600" stroke="#60738a" stroke-width="2.5" marker-end="url(#arrow)" stroke-dasharray="6 5"/>
    <text x="603.600" y="288.600" font-size="19" fill="#60738a" text-anchor="start">Z</text>
    <circle cx="595.600" cy="351.200" r="4" fill="#21324b"/>
    <text x="602.600" y="379.200" font-size="20" fill="#21324b" text-anchor="start">U</text>
    <text x="365.000" y="424.000" font-size="20" fill="#21324b" text-anchor="start">U=(1,0,0) を選んだ例</text>
    <text x="365.000" y="463.000" font-size="20" fill="#21324b" text-anchor="start">Pの座標</text>
    <text x="365.000" y="503.000" font-size="24" fill="#21324b" text-anchor="start">(1.4,4,5.2)</text>
    <text x="365.000" y="393.000" font-size="18" fill="#21324b" text-anchor="start">X=+WCS Y、Y=−WCS X</text>
    <rect x="680" y="110" width="310" height="430" rx="8" fill="#f6f8fb" stroke="#c7d1df"/>
    <text x="694.000" y="144.000" font-size="21" fill="#21324b" text-anchor="start">OCS：図形に対応する基準</text>
    <circle cx="796.320" cy="160.160" r="4" fill="#23743d"/>
    <text x="788.320" y="188.160" font-size="20" fill="#23743d" text-anchor="start">同じP</text>
    <line x1="900.000" y1="340.000" x2="796.320" y2="160.160" stroke="#21324b" stroke-width="1.6" stroke-dasharray="6 5"/>
    <line x1="900.000" y1="340.000" x2="853.920" y2="319.840" stroke="#bd372c" stroke-width="2.5" marker-end="url(#arrow)"/>
    <text x="819.920" y="307.840" font-size="19" fill="#bd372c" text-anchor="start">Ax</text>
    <line x1="900.000" y1="340.000" x2="927.648" y2="284.704" stroke="#23743d" stroke-width="2.5" marker-end="url(#arrow)"/>
    <text x="935.648" y="276.704" font-size="19" fill="#23743d" text-anchor="start">Ay</text>
    <line x1="900.000" y1="340.000" x2="879.264" y2="309.472" stroke="#2264bc" stroke-width="2.5" marker-end="url(#arrow)"/>
    <text x="861.264" y="291.472" font-size="19" fill="#2264bc" text-anchor="start">N</text>
    <circle cx="900.000" cy="340.000" r="4" fill="#21324b"/>
    <text x="907.000" y="368.000" font-size="20" fill="#21324b" text-anchor="start">O</text>
    <text x="695.000" y="424.000" font-size="20" fill="#21324b" text-anchor="start">原点はO。Cではない</text>
    <text x="695.000" y="463.000" font-size="20" fill="#21324b" text-anchor="start">Pの座標</text>
    <text x="695.000" y="503.000" font-size="24" fill="#21324b" text-anchor="start">(3,2,5)</text>
    <text x="35.000" y="580.000" font-size="21" fill="#21324b" text-anchor="start">共通の斜投影。UCSは説明用の固定例で、実演では設定を変えない。</text>
  </g>
</svg>
