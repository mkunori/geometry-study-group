<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="620" viewBox="0 0 1000 620" role="img" aria-labelledby="title desc" style="font-family:Yu Gothic,Meiryo,Noto Sans CJK JP,sans-serif">
  <title id="title">任意軸の分岐：境界は「未満」に含まれない</title>
  <desc id="desc">単位法線のX成分とY成分を比較する。絶対値がともに1/64未満の開いた正方形の内部だけでWCS Y軸を選び、境界線および外部ではWCS Z軸を選ぶ。</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto-start-reverse">
      <path d="M0,0 L8,4 L0,8 Z" fill="context-stroke"/>
    </marker>
  </defs>
  <rect width="1000" height="620" fill="#ffffff"/>
  <text x="30" y="42" font-size="27" fill="#21324b" text-anchor="start">任意軸の分岐：境界は「未満」に含まれない</text>
  <rect x="160" y="160" width="280" height="280" fill="#e7f1ff" stroke="#c34c2c" stroke-width="3" stroke-dasharray="8 5"/>
  <line x1="70.000" y1="300.000" x2="515.000" y2="300.000" stroke="#60738a" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="300.000" y1="500.000" x2="300.000" y2="80.000" stroke="#60738a" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="505" y="334" font-size="22" fill="#21324b" text-anchor="start">Nx</text>
  <text x="312" y="85" font-size="22" fill="#21324b" text-anchor="start">Ny</text>
  <text x="160" y="328" font-size="20" fill="#21324b" text-anchor="middle">−b</text>
  <text x="440" y="328" font-size="20" fill="#21324b" text-anchor="middle">b</text>
  <text x="282" y="167" font-size="20" fill="#21324b" text-anchor="end">b</text>
  <text x="282" y="447" font-size="20" fill="#21324b" text-anchor="end">−b</text>
  <text x="300" y="225" font-size="20" fill="#21324b" text-anchor="middle">内部だけY軸分岐</text>
  <circle cx="300.000" cy="230.000" r="5" fill="#2264bc"/>
  <text x="310" y="258" font-size="18" fill="#21324b" text-anchor="start">(0,b/2)：Z近傍例</text>
  <circle cx="440.000" cy="300.000" r="5" fill="#c34c2c"/>
  <text x="448" y="284" font-size="18" fill="#c34c2c" text-anchor="start">(b,0)</text>
  <text x="565" y="135" font-size="25" fill="#21324b" text-anchor="start">b = 1/64</text>
  <text x="565" y="185" font-size="24" fill="#2264bc" text-anchor="start">Y軸を使う条件</text>
  <text x="565" y="225" font-size="22" fill="#21324b" text-anchor="start">|Nx| &lt; b かつ |Ny| &lt; b</text>
  <text x="565" y="285" font-size="23" fill="#c34c2c" text-anchor="start">等号・境界線はZ軸分岐</text>
  <text x="565" y="330" font-size="21" fill="#21324b" text-anchor="start">片方だけが小さくても不可</text>
  <text x="565" y="390" font-size="21" fill="#21324b" text-anchor="start">比較するのは単位化したN。</text>
  <text x="565" y="430" font-size="20" fill="#21324b" text-anchor="start">epsilonによる境界拡張はしない。</text>
  <text x="50" y="550" font-size="21" fill="#21324b" text-anchor="start">N=(x,0,√(1−x²))：xがbの直前 → Y、ちょうどb → Z、直後 → Z</text>
  <text x="50" y="590" font-size="21" fill="#21324b" text-anchor="start">法線が近くても、選ばれるX・Y軸が連続するとは限らない。</text>
</svg>
