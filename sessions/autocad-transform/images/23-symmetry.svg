<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="620" viewBox="0 0 1000 620" role="img" aria-labelledby="title desc">
  <title id="title">同じ輪郭に見えても、同じ変換とは限らない</title>
  <desc id="desc">原点中心の正方形は+π/2回転で外形が重なるが、頂点(1,1,0)は(-1,1,0)へ動く。頂点番号と原点・各軸上の点や行列も照合する理由を示す。</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse" markerUnits="userSpaceOnUse">
      <path d="M0,0 L7,4 L0,8 Z" fill="context-stroke"/>
    </marker>
  </defs>
  <rect width="1000" height="620" fill="white"/>
  <g font-family="Yu Gothic, Meiryo, Noto Sans CJK JP, sans-serif">
    <text x="30" y="43" font-size="27" fill="#21324b" text-anchor="start">同じ輪郭に見えても、同じ変換とは限らない</text>
    <text x="35" y="90" font-size="22" fill="#21324b" text-anchor="start">原点中心の正方形：何もしない場合と+π/2回転で、外形は同じ。</text>
    <polygon points="170.000,460.000 430.000,460.000 430.000,200.000 170.000,200.000" fill="#60738a" fill-opacity="0.07" stroke="#60738a" stroke-width="3"/>
    <polygon points="430.000,460.000 430.000,200.000 170.000,200.000 170.000,460.000" fill="#bd372c" fill-opacity="0.07" stroke="#bd372c" stroke-width="3" stroke-dasharray="8 6"/>
    <circle cx="430.000" cy="200.000" r="5" fill="#60738a" data-world="1,1,0" data-origin="300,330" data-scale="130" data-projection="xy"/>
    <text x="442" y="188" font-size="21" fill="#60738a" text-anchor="start">回転前 (1,1,0)</text>
    <circle cx="170.000" cy="200.000" r="5" fill="#bd372c" data-world="-1,1,0" data-origin="300,330" data-scale="130" data-projection="xy"/>
    <text x="20" y="188" font-size="21" fill="#bd372c" text-anchor="start">回転後 (−1,1,0)</text>
    <line x1="105.000" y1="330.000" x2="521.000" y2="330.000" stroke="#60738a" stroke-width="1.5" marker-end="url(#arrow)"/>
    <line x1="300.000" y1="525.000" x2="300.000" y2="109.000" stroke="#60738a" stroke-width="1.5" marker-end="url(#arrow)"/>
    <circle cx="300.000" cy="330.000" r="5" fill="#21324b" data-world="0,0,0" data-origin="300,330" data-scale="130" data-projection="xy"/>
    <text x="308" y="354" font-size="21" fill="#21324b" text-anchor="start">O</text>
    <rect x="620" y="170" width="345" height="260" rx="8" fill="#f6f8fb" stroke="#c7d1df"/>
    <text x="640" y="210" font-size="25" fill="#21324b" text-anchor="start">外形が同じでも</text>
    <text x="640" y="253" font-size="24" fill="#bd372c" text-anchor="start">頂点の位置は変わる</text>
    <text x="640" y="315" font-size="23" fill="#21324b" text-anchor="start">原点・3軸上の点</text>
    <text x="640" y="355" font-size="23" fill="#21324b" text-anchor="start">方向・行列全要素も</text>
    <text x="640" y="397" font-size="23" fill="#21324b" text-anchor="start">合わせて照合する</text>
    <text x="35" y="550" font-size="22" fill="#21324b" text-anchor="start">灰色と赤の破線は同じ外形。点のラベルで回転を見分ける。</text>
    <text x="35" y="590" font-size="21" fill="#21324b" text-anchor="start">WCSのXY平面を+Z側から見る。Z成分は0。</text>
  </g>
</svg>
