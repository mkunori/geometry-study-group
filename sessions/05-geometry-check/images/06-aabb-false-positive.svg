<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="660" viewBox="0 0 1000 660" role="img" aria-labelledby="title desc">
<title id="title">固定例D：AABBは重なるが、実体は斜めに分離する</title><desc id="desc">T1=(0,0),(3,0),(0,3)とT2=(2,2),(5,2),(2,5)。共通AABBは[2,3]×[2,3]で面積1だが、実体はx+y≤3とx+y≥4で離れる。</desc><defs>
<marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#1565c0" /></marker>
<marker id="orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#ba4b00" /></marker>
<marker id="purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#7b3294" /></marker>
<marker id="gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#58677c" /></marker>
</defs><rect width="1000" height="660" fill="white" /><g font-family="Yu Gothic, Meiryo, Noto Sans CJK JP, sans-serif" fill="#172b4d">
<text x="30" y="42" fill="#172b4d" font-size="28" text-anchor="start" font-weight="700">固定例D：AABBは重なるが、実体は斜めに分離する</text>
<line x1="120" y1="485" x2="525" y2="485" stroke="#58677c" stroke-width="2" marker-end="url(#gray)" />
<line x1="120" y1="485" x2="120" y2="110" stroke="#58677c" stroke-width="2" marker-end="url(#gray)" />
<text x="533" y="493" fill="#58677c" font-size="22" text-anchor="start">X</text>
<text x="98" y="102" fill="#58677c" font-size="22" text-anchor="start">Y</text>
<polygon points="120,485 315,485 315,290 120,290" fill="#e5eef9" fill-opacity=".15" stroke="#1565c0" stroke-width="2" />
<polygon points="250,355 445,355 445,160 250,160" fill="#f9e9db" fill-opacity=".15" stroke="#ba4b00" stroke-width="2" />
<polygon points="250,355 315,355 315,290 250,290" fill="#ece5f3" fill-opacity=".8" stroke="#7b3294" stroke-width="2" />
<polygon points="120,485 315,485 120,290" fill="#e5eef9" fill-opacity=".30" stroke="#1565c0" stroke-width="2" />
<polygon points="250,355 445,355 250,160" fill="#f9e9db" fill-opacity=".30" stroke="#ba4b00" stroke-width="2" />
<line x1="120" y1="257.5" x2="347.5" y2="485" stroke="#7b3294" stroke-width="2" stroke-dasharray="7 6" />
<circle cx="120" cy="485" r="5" fill="#1565c0" data-coordinate="0,0" data-origin="120,485" data-scale="65" data-projection="p2" />
<circle cx="315" cy="485" r="5" fill="#1565c0" data-coordinate="3,0" data-origin="120,485" data-scale="65" data-projection="p2" />
<circle cx="120" cy="290" r="5" fill="#1565c0" data-coordinate="0,3" data-origin="120,485" data-scale="65" data-projection="p2" />
<circle cx="250" cy="355" r="5" fill="#ba4b00" data-coordinate="2,2" data-origin="120,485" data-scale="65" data-projection="p2" />
<circle cx="445" cy="355" r="5" fill="#ba4b00" data-coordinate="5,2" data-origin="120,485" data-scale="65" data-projection="p2" />
<circle cx="250" cy="160" r="5" fill="#ba4b00" data-coordinate="2,5" data-origin="120,485" data-scale="65" data-projection="p2" />
<text x="155" y="425" fill="#1565c0" font-size="25" text-anchor="start">T1</text>
<text x="355" y="265" fill="#ba4b00" font-size="25" text-anchor="start">T2</text>
<text x="570" y="160" fill="#1565c0" font-size="25" text-anchor="start">T1：x+y ≤ 3</text>
<text x="570" y="225" fill="#ba4b00" font-size="25" text-anchor="start">T2：x+y ≥ 4</text>
<text x="570" y="310" fill="#7b3294" font-size="24" text-anchor="start">紫の共通AABB：面積1</text>
<text x="570" y="385" fill="#172b4d" font-size="26" text-anchor="start" font-weight="700">実体は Separated</text>
<text x="570" y="465" fill="#172b4d" font-size="22" text-anchor="start">箱は候補、実体は別に調べる</text>
<text x="35" y="585" fill="#172b4d" font-size="23" text-anchor="start">破線はx+y=3.5の分離直線。点が両方に属する余地はない。</text>
<text x="35" y="630" fill="#172b4d" font-size="22" text-anchor="start">AABBによるBroad phase → 実体の条件によるNarrow phase</text>
</g></svg>
