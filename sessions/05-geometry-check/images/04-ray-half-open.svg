<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="650" viewBox="0 0 1000 650" role="img" aria-labelledby="title desc">
<title id="title">水平レイ：下端を含め、上端を含めない</title><desc id="desc">L字のR=(0.5,1)から右向きのレイを出す。x=4の辺の上端は除外、x=1の辺の下端は含める。水平辺を数えず交差は1回。</desc><defs>
<marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#1565c0" /></marker>
<marker id="orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#ba4b00" /></marker>
<marker id="purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#7b3294" /></marker>
<marker id="gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#58677c" /></marker>
</defs><rect width="1000" height="650" fill="white" /><g font-family="Yu Gothic, Meiryo, Noto Sans CJK JP, sans-serif" fill="#172b4d">
<text x="30" y="42" fill="#172b4d" font-size="28" text-anchor="start" font-weight="700">水平レイ：下端を含め、上端を含めない</text>
<polygon points="110,475 410,475 410,400 185,400 185,175 110,175" fill="#e5eef9" fill-opacity=".30" stroke="#1565c0" stroke-width="2" />
<line x1="147.5" y1="400" x2="515" y2="400" stroke="#7b3294" stroke-width="3" marker-end="url(#purple)" stroke-dasharray="7 6" />
<circle cx="147.5" cy="400" r="5" fill="#7b3294" data-coordinate="0.5,1" data-origin="110,475" data-scale="75" data-projection="p2" />
<text x="82.5" y="445" fill="#7b3294" font-size="24" text-anchor="start">R=(0.5,1)</text>
<circle cx="185" cy="400" r="5" fill="#7b3294" data-coordinate="1,1" data-origin="110,475" data-scale="75" data-projection="p2" />
<circle cx="410" cy="400" r="8" fill="white" stroke="#ba4b00" stroke-width="3" />
<text x="195" y="320" fill="#7b3294" font-size="22" text-anchor="start">x=1：下端を含む</text>
<line x1="240" y1="335" x2="185" y2="400" stroke="#7b3294" stroke-width="1" />
<text x="285" y="365" fill="#ba4b00" font-size="22" text-anchor="start">x=4：上端を除外</text>
<line x1="420" y1="370" x2="410" y2="400" stroke="#ba4b00" stroke-width="1" />
<text x="540" y="145" fill="#172b4d" font-size="25" text-anchor="start" font-weight="700">minY ≤ py &lt; maxY</text>
<text x="540" y="215" fill="#172b4d" font-size="24" text-anchor="start">水平辺：回数から除外</text>
<text x="540" y="285" fill="#172b4d" font-size="23" text-anchor="start">交点がPより右の辺だけ</text>
<text x="540" y="355" fill="#7b3294" font-size="26" text-anchor="start">交差1回 → Inside</text>
<text x="540" y="445" fill="#172b4d" font-size="23" text-anchor="start">境界上なら先にBoundary</text>
<text x="35" y="565" fill="#172b4d" font-size="22" text-anchor="start">このレイは水平辺の延長と重なるが、境界点Rではない。回数の規約で扱う。</text>
<text x="35" y="615" fill="#172b4d" font-size="21" text-anchor="start">一般の極大頂点は0辺、極小頂点は2辺で数え、触れるだけなら偶奇を変えない。</text>
</g></svg>
