<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600" role="img" aria-labelledby="title desc">
<title id="title">断面の2D座標を、3Dの2つの基底へ対応させる</title><desc id="desc">u右・v上の断面をN=+Y、B=+Zに対応させる。N×B=T=+X。+T側から原点へ見ると反時計回り。</desc><defs>
<marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#1565c0" /></marker>
<marker id="orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#ba4b00" /></marker>
<marker id="purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#7b3294" /></marker>
<marker id="gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#58677c" /></marker>
</defs><rect width="1000" height="600" fill="white" /><g font-family="Yu Gothic, Meiryo, Noto Sans CJK JP, sans-serif" fill="#172b4d">
<text x="30" y="42" fill="#172b4d" font-size="28" text-anchor="start" font-weight="700">断面の2D座標を、3Dの2つの基底へ対応させる</text>
<polygon points="80,402.5 230,402.5 230,327.5 80,327.5" fill="#e5eef9" fill-opacity=".65" stroke="#1565c0" stroke-width="2" />
<line x1="155" y1="365" x2="400" y2="365" stroke="#1565c0" stroke-width="3" marker-end="url(#blue)" />
<text x="405" y="375" fill="#1565c0" font-size="24" text-anchor="start">u</text>
<line x1="155" y1="365" x2="155" y2="155" stroke="#ba4b00" stroke-width="3" marker-end="url(#orange)" />
<text x="170" y="160" fill="#ba4b00" font-size="24" text-anchor="start">v</text>
<circle cx="155" cy="365" r="5" fill="#172b4d" />
<text x="95" y="420" fill="#172b4d" font-size="24" text-anchor="start">(0,0)</text>
<text x="30" y="108" fill="#172b4d" font-size="26" text-anchor="start" font-weight="700">2D：u右・v上</text>
<line x1="80" y1="402.5" x2="155" y2="402.5" stroke="#7b3294" stroke-width="3" marker-end="url(#purple)" />
<line x1="230" y1="402.5" x2="230" y2="365" stroke="#7b3294" stroke-width="3" marker-end="url(#purple)" />
<line x1="230" y1="327.5" x2="155" y2="327.5" stroke="#7b3294" stroke-width="3" marker-end="url(#purple)" />
<line x1="80" y1="327.5" x2="80" y2="365" stroke="#7b3294" stroke-width="3" marker-end="url(#purple)" />
<text x="45" y="485" fill="#7b3294" font-size="24" text-anchor="start">輪郭は反時計回り</text>
<line x1="455" y1="300" x2="545" y2="300" stroke="#58677c" stroke-width="3" marker-end="url(#gray)" />
<polygon points="819.5,453 700.5,378.2 700.5,317 819.5,391.8" fill="#e5eef9" fill-opacity=".65" stroke="#1565c0" stroke-width="2" />
<line x1="760" y1="385" x2="641" y2="310.2" stroke="#1565c0" stroke-width="3" marker-end="url(#blue)" />
<text x="621" y="290.2" fill="#1565c0" font-size="24" text-anchor="start">N=+Y</text>
<line x1="760" y1="385" x2="760" y2="201.4" stroke="#ba4b00" stroke-width="3" marker-end="url(#orange)" />
<text x="775" y="191.4" fill="#ba4b00" font-size="24" text-anchor="start">B=+Z</text>
<line x1="760" y1="385" x2="923.2" y2="330.6" stroke="#7b3294" stroke-width="3" marker-end="url(#purple)" />
<text x="923.2" y="365.6" fill="#7b3294" font-size="24" text-anchor="start">T=+X</text>
<circle cx="760" cy="385" r="5" fill="#172b4d" />
<text x="775" y="425" fill="#172b4d" font-size="24" text-anchor="start">C</text>
<text x="565" y="108" fill="#172b4d" font-size="26" text-anchor="start" font-weight="700">3D：N × B = T</text>
<text x="545" y="485" fill="#172b4d" font-size="24" text-anchor="start">右手系：N、B、Tの順</text>
<text x="30" y="555" fill="#172b4d" font-size="23" text-anchor="start">反時計回りの視点は、+T側から断面の原点へ向かう視線。</text>
</g></svg>
