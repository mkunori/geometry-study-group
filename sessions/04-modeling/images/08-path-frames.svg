<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="660" viewBox="0 0 1000 660" role="img" aria-labelledby="title desc">
<title id="title">固定例C：曲がると断面の向きも変わる</title><desc id="desc">XY平面を上から見る。中心線(0,0,0)から(5,0,0)を経て(5,4,0)へ。局所点(1,0)は始点(0,1,0)、終点(4,4,0)。角の接続は未定義。</desc><defs>
<marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#1565c0" /></marker>
<marker id="orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#ba4b00" /></marker>
<marker id="purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#7b3294" /></marker>
<marker id="gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#58677c" /></marker>
</defs><rect width="1000" height="660" fill="white" /><g font-family="Yu Gothic, Meiryo, Noto Sans CJK JP, sans-serif" fill="#172b4d">
<text x="30" y="42" fill="#172b4d" font-size="28" text-anchor="start" font-weight="700">固定例C：曲がると断面の向きも変わる</text>
<line x1="115" y1="480" x2="440" y2="480" stroke="#58677c" stroke-width="5" marker-end="url(#gray)" />
<line x1="440" y1="480" x2="440" y2="220" stroke="#58677c" stroke-width="5" marker-end="url(#gray)" />
<circle cx="115" cy="480" r="5" fill="#58677c" data-coordinate="0,0,0" data-origin="115,480" data-scale="65" data-projection="xy" />
<text x="50" y="525" fill="#58677c" font-size="24" text-anchor="start">C始=(0,0,0)</text>
<circle cx="440" cy="480" r="5" fill="#58677c" data-coordinate="5,0,0" data-origin="115,480" data-scale="65" data-projection="xy" />
<text x="465" y="490" fill="#58677c" font-size="24" text-anchor="start">角=(5,0,0)</text>
<circle cx="440" cy="220" r="5" fill="#58677c" data-coordinate="5,4,0" data-origin="115,480" data-scale="65" data-projection="xy" />
<text x="465" y="225" fill="#58677c" font-size="24" text-anchor="start">C終=(5,4,0)</text>
<line x1="115" y1="480" x2="115" y2="376" stroke="#1565c0" stroke-width="3" marker-end="url(#blue)" />
<text x="45" y="330" fill="#1565c0" font-size="24" text-anchor="start">N=+Y</text>
<line x1="115" y1="480" x2="212.5" y2="480" stroke="#7b3294" stroke-width="3" marker-end="url(#purple)" />
<text x="190" y="460" fill="#7b3294" font-size="24" text-anchor="start">T=+X</text>
<line x1="440" y1="220" x2="336" y2="220" stroke="#1565c0" stroke-width="3" marker-end="url(#blue)" />
<text x="280" y="170" fill="#1565c0" font-size="24" text-anchor="start">N=−X</text>
<line x1="440" y1="220" x2="440" y2="142" stroke="#7b3294" stroke-width="3" marker-end="url(#purple)" />
<text x="455" y="130" fill="#7b3294" font-size="24" text-anchor="start">T=+Y</text>
<circle cx="115" cy="415" r="5" fill="#ba4b00" data-coordinate="0,1,0" data-origin="115,480" data-scale="65" data-projection="xy" />
<text x="130" y="405" fill="#ba4b00" font-size="24" text-anchor="start">(0,1,0)</text>
<circle cx="375" cy="220" r="5" fill="#ba4b00" data-coordinate="4,4,0" data-origin="115,480" data-scale="65" data-projection="xy" />
<text x="285" y="265" fill="#ba4b00" font-size="24" text-anchor="start">(4,4,0)</text>
<text x="625" y="250" fill="#172b4d" font-size="24" text-anchor="start">局所 (u,v)=(1,0)</text>
<text x="625" y="310" fill="#172b4d" font-size="23" text-anchor="start">B=+Z：紙面の手前</text>
<text x="625" y="380" fill="#172b4d" font-size="22" text-anchor="start">始点：C + N = (0,1,0)</text>
<text x="625" y="430" fill="#172b4d" font-size="22" text-anchor="start">終点：C + N = (4,4,0)</text>
<text x="40" y="580" fill="#172b4d" font-size="22" text-anchor="start">角では接線が+Xから+Yへ不連続。2端点の配置だけでは継ぎ目を定義できない。</text>
<text x="40" y="630" fill="#172b4d" font-size="22" text-anchor="start">経路の位置だけでなく、フレーム・対応点・コーナー処理を別々に決める。</text>
</g></svg>
