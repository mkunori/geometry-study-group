<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="630" viewBox="0 0 1000 630" role="img" aria-labelledby="title desc">
<title id="title">閉じた境界と体積：断面積2 × 長さ5 = 10</title><desc id="desc">左は両端をキャップで閉じた直柱で頂点8、三角形12。右は側面だけで両端が開いた表面。表面の面積と内部の体積を区別する。</desc><defs>
