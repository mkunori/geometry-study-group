<text x="40" y="495" fill="#7b3294" font-size="28" text-anchor="start" font-weight="700">閉じた直柱：V = 2 × 5 = 10</text>
<text x="40" y="555" fill="#172b4d" font-size="22" text-anchor="start">辺の共有・向き・自己交差も確認する。穴や向きの混在は体積式で修復できない。</text>
<text x="40" y="605" fill="#172b4d" font-size="22" text-anchor="start">右図は体積領域を囲み切っていない。紙面の透け具合は厚みではない。</text>
