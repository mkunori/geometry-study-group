<text x="305" y="125" fill="#7b3294" font-size="28" text-anchor="middle" font-weight="700">T</text>
<rect x="368" y="150" width="84" height="270" rx="8" fill="#58677c" fill-opacity=".09" />
<text x="410" y="125" fill="#58677c" font-size="28" text-anchor="middle" font-weight="700">C</text>
