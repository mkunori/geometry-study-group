<text x="600" y="125" fill="#172b4d" font-size="26" text-anchor="middle" font-weight="700">局所</text>
<text x="840" y="125" fill="#172b4d" font-size="26" text-anchor="middle" font-weight="700">世界</text>
<text x="45" y="490" fill="#7b3294" font-size="24" text-anchor="start">入力の第3成分 w=0：断面内の点</text>
<text x="45" y="540" fill="#172b4d" font-size="23" text-anchor="start">最後の成分 1：平行移動を受ける点。方向ベクトルなら0。</text>
</g></svg>
